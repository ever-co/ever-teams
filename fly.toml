# fly.toml app configuration file generated for ever-teams on 2023-10-26T08:19:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "ever-teams"
primary_region = "lax"
kill_signal = "SIGINT"
kill_timeout = "5m0s"

[build]
  image = "ghcr.io/ever-co/ever-teams-webapp:latest"

# Runtime configuration of the image (no rebuild needed; full list in .env.docker). Point both URLs at your own
# Gauzy API origin (without a trailing /api) to self-host the backend too. Keep secrets out of this file:
#   fly secrets set AUTH_SECRET=$(openssl rand -base64 32)
[env]
  GAUZY_API_SERVER_URL = "https://api.ever.team"
  NEXT_PUBLIC_GAUZY_API_SERVER_URL = "https://api.ever.team"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
