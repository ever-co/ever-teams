# A person chooses a task in the Work tab, opens it from their own card, the first of the Team tab, and reads it.
appId: ${APP_ID}
env:
  EMAIL: kofi.arden@example.com
---
- runFlow: common/sign-in.yaml
- runFlow: common/timer-stopped.yaml
- runFlow: common/task-chosen.yaml
# After a sign-in, the person's own card shows their task only once the app starts again (#5521)
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "tab-team"
    timeout: 30000
- tapOn:
    id: "tab-team"
- extendedWaitUntil:
    visible:
      id: "member-task"
    timeout: 30000
- tapOn:
    id: "member-task"
    index: 0
- extendedWaitUntil:
    visible:
      id: "task-screen"
    timeout: 30000
# The screen shows before the task's answer is in: its title fills in with the answer, and the error screen an answer
# the screen could not read would show in its place
- extendedWaitUntil:
    visible:
      id: "task-title"
      text: ".+"
    timeout: 30000
- assertVisible:
    id: "task-screen"
- takeScreenshot: task-open
