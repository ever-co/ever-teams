# A person who started the timer by mistake discards the run: no time is kept.
appId: ${APP_ID}
env:
  EMAIL: kofi.arden@example.com
---
- runFlow: common/sign-in.yaml
- runFlow: common/timer-stopped.yaml
- runFlow: common/task-chosen.yaml
- tapOn:
    id: "timer-start"
- runFlow: common/run-confirmed.yaml
- tapOn:
    id: "timer-actions-trigger"
- tapOn:
    id: "timer-discard"
- extendedWaitUntil:
    visible:
      id: "confirmation-confirm"
    timeout: 10000
- tapOn:
    id: "confirmation-confirm"
# the run's menu goes once the status read after the discard says no timer runs
- runFlow: common/stop-confirmed.yaml
- takeScreenshot: discarded
