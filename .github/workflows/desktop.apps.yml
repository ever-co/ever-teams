          USE_SYSTEM_FPM: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          DO_KEY_ID: ${{ secrets.DO_KEY_ID }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: false
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"
          DESKTOP_TIMER_APP_REPO_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_OWNER: "ever-co"
          DESKTOP_TIMER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_TIMER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          # Translations: apps/desktop/i18n no longer exists in this repo (removed in the 2026-06-06
          # "next" commit), so every download from the old URL 404s and gauzy's translation-util then
          # leaves apps/desktop-timer/src/assets/i18n EMPTY (it only copies its bundled defaults when
          # the URL is unset) — the shipped app would show raw i18n keys. Leave the URL empty so gauzy's
          # complete ui-core translations are bundled; set repo/org var DESKTOP_I18N_FILES_URL to a
          # folder of Ever Teams-specific <lang>.json files to override (previous value:
          # https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/desktop/i18n).
          I18N_FILES_URL: ${{ vars.DESKTOP_I18N_FILES_URL }}
          # Local copies made by the "Fetch Ever Teams branding assets" step (paths are relative to
          # apps/desktop-timer/src, the same form as gauzy's own defaults). Previously the dead
          # https://ever.team/assets/ever-teams.png and .../ever-teams-512x512.png.
          PLATFORM_LOGO: "assets/branding/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "assets/branding/ever-teams-512x512.png"
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
          SNAPCRAFT_BUILD_ENVIRONMENT: host

      # The yarn + .nx cache these jobs share has grown to ~9.5 GB: every job spends ~10 min RESTORING it, and
      # when the key changes the POST step uploads all of it — on 2026-08-18 that upload stalled at 52% and
      # burned the whole 300-minute job budget, so `release-linux` was cancelled after 5 h with the app already
      # built (run 32101473424). `.nx/cache` grows forever because the cache key only changes with yarn.lock.
      # This trims the OLDEST `.nx/cache` entries until the directory fits the budget, right before the cache
      # POST step reads it: nothing the build needs is touched (nx recomputes a missing entry), the yarn cache
      # is left alone, and the step can never fail a build. Set repo/org var DESKTOP_CACHE_MAX_MB to another
      # size in MB, or to 0 to disable the trim. Node is used instead of `find -printf` (GNU-only: it would
      # silently do nothing on the macOS runners).
      - name: Bound the CI cache before it is saved
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DESKTOP_CACHE_MAX_MB: ${{ vars.DESKTOP_CACHE_MAX_MB }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const limitMb = Number(process.env.DESKTOP_CACHE_MAX_MB || 2048);
            const dir = ".nx/cache";
            if (!limitMb) { console.log("DESKTOP_CACHE_MAX_MB=0 - trim disabled"); process.exit(0); }
            if (!fs.existsSync(dir)) { console.log("no " + dir + " - nothing to trim"); process.exit(0); }
            const sizeOf = (p) => {
              let total = 0;
              const stack = [p];
              while (stack.length) {
                const cur = stack.pop();
                let st; try { st = fs.lstatSync(cur); } catch { continue; }
                if (st.isDirectory()) { for (const n of fs.readdirSync(cur)) stack.push(path.join(cur, n)); }
                else total += st.size;
              }
              return total;
            };
            const limit = limitMb * 1024 * 1024;
            const entries = fs.readdirSync(dir).map((n) => {
              const p = path.join(dir, n);
              let mtime = 0; try { mtime = fs.lstatSync(p).mtimeMs; } catch {}
              return { p, mtime, size: sizeOf(p) };
            });
            let total = entries.reduce((a, e) => a + e.size, 0);
            const mb = (b) => Math.round(b / 1048576);
            console.log(dir + " is " + mb(total) + " MB in " + entries.length + " entries (budget " + limitMb + " MB)");
            if (total <= limit) { console.log("within budget - nothing to do"); process.exit(0); }
            entries.sort((a, b) => a.mtime - b.mtime);
            let removed = 0;
            for (const e of entries) {
              if (total <= limit) break;
              try { fs.rmSync(e.p, { recursive: true, force: true }); total -= e.size; removed++; } catch {}
            }
            console.log("trimmed " + removed + " oldest entries; " + dir + " is now " + mb(total) + " MB");
          '

  release-mac:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: [ghcr.io/cirruslabs/macos-runner:tahoe]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: "ever-co/ever-gauzy"
          ref: master

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Fix node-gyp and Python
        run: python3 -m pip install --break-system-packages packaging setuptools || python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        shell: bash
        run: |
          if [ -n "${{ secrets.VERDACCIO_TOKEN }}" ]; then
            echo "//packages.ever.co/:_authToken=${{ secrets.VERDACCIO_TOKEN }}" >> .npmrc
            echo "registry=https://packages.ever.co/" >> .npmrc
          fi

      - name: Install Yarn dependencies
        # yarn 1 does NOT retry a failed git-dependency tarball fetch, so one transient
        # `codeload.github.com/... : Request failed "429 Too Many Requests"` (the fleet shares a single
        # egress IP and GitHub throttles it whenever several jobs install at once) throws away a build
        # that is already 40+ minutes in — it killed release-linux twice on 2026-08-18 (runs 32101473424,
        # 32139317563), each time with nothing wrong in the repo. Retry with a linear back-off instead.
        # bash (not the Windows default shell) so the loop is identical on every runner; Git Bash is put
        # on PATH by the "Prefer Git Bash for bash steps" step above.
        shell: bash
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: |
          install() { yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts; }
          for attempt in 1 2 3 4; do
            if install; then exit 0; fi
            if [ "$attempt" = 4 ]; then
              echo "::error title=yarn install::failed 4 times - this is very unlikely to be transient"
              exit 1
            fi
            wait=$((attempt * 60))
            echo "::warning title=yarn install retry::attempt ${attempt} failed (usually a codeload/registry 429) - retrying in ${wait}s"
            sleep "$wait"
          done

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version desktop timer app
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.desktopTimer(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_NAME: 'ever-teams-desktop'
          DESKTOP_TIMER_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"

      - name: Prepare Apple API Key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      # See release-linux: the upstream bump script re-injects the dead DigitalOcean Spaces publisher
      # (bucket `ever` returns NoSuchBucket, which fails the whole publish after the GitHub upload).
      - name: Drop DigitalOcean Spaces publish target
        if: ${{ vars.DO_ENABLED != 'true' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/desktop-timer/src/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const current = (pkg.build && pkg.build.publish) || [];
            const list = Array.isArray(current) ? current : [current];
            const kept = list.filter((p) => !(p && p.provider === "spaces"));
            if (kept.length !== list.length) {
              pkg.build.publish = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
