        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ever-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/ever-signing-cert.p12"
          printf '%s' "$CSC_LINK_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          # The KEYCHAIN password here — this is the exact call app-builder-lib gets wrong.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          rm -f "$CERT"
          # Fail loudly here rather than silently shipping an unsigned app later.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee /tmp/identities.txt
          grep -q "Developer ID Application" /tmp/identities.txt

      - name: Build Desktop Timer App
        run: "yarn build:desktop-timer:mac:release"
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          DO_KEY_ID: ${{ secrets.DO_KEY_ID }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: false
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"
          DESKTOP_TIMER_APP_REPO_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_OWNER: "ever-co"
          DESKTOP_TIMER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
