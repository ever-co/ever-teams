          # "next" commit), so every download from the old URL 404s and gauzy's translation-util then
          # leaves apps/desktop-timer/src/assets/i18n EMPTY (it only copies its bundled defaults when
          # the URL is unset) — the shipped app would show raw i18n keys. Leave the URL empty so gauzy's
          # complete ui-core translations are bundled; set repo/org var DESKTOP_I18N_FILES_URL to a
          # folder of Ever Teams-specific <lang>.json files to override (previous value:
          # https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/desktop/i18n).
          I18N_FILES_URL: ${{ vars.DESKTOP_I18N_FILES_URL }}
          # Local copies made by the "Fetch Ever Teams branding assets" step (paths are relative to
          # apps/desktop-timer/src, the same form as gauzy's own defaults). Previously the dead
          # https://ever.team/assets/ever-teams.png and .../ever-teams-512x512.png.
          PLATFORM_LOGO: "assets/branding/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "assets/branding/ever-teams-512x512.png"
          # macOS notarization. electron-builder 26 accepts ONE credential set and checks the
          # Apple-ID pair FIRST: whenever APPLE_ID is set it demands APPLE_APP_SPECIFIC_PASSWORD
          # and aborts the build ("APPLE_APP_SPECIFIC_PASSWORD env var needs to be set") before
          # it ever looks at the App Store Connect API key. The intended path here is the API
          # key (APPLE_API_KEY* below; gauzy's afterSign hook tools/notarize.js defers to
          # electron-builder when APPLE_API_KEY is a file path), and no APPLE_ID_APP_PASSWORD
          # secret exists, so the Apple-ID pair is only exported when an app-specific password
          # is actually configured — and then also under the name electron-builder reads
          # (APPLE_APP_SPECIFIC_PASSWORD; APPLE_ID_APP_PASSWORD is kept for the older name).
          APPLE_ID: ${{ secrets.APPLE_ID_APP_PASSWORD != '' && secrets.APPLE_ID || '' }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK deliberately NOT set: that is what makes electron-builder build its own
          # (broken) keychain. Point it at the one imported above instead.
          CSC_KEYCHAIN: ${{ runner.temp }}/ever-signing.keychain-db
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # The yarn + .nx cache these jobs share has grown to ~9.5 GB: every job spends ~10 min RESTORING it, and
      # when the key changes the POST step uploads all of it — on 2026-08-18 that upload stalled at 52% and
      # burned the whole 300-minute job budget, so `release-linux` was cancelled after 5 h with the app already
      # built (run 32101473424). `.nx/cache` grows forever because the cache key only changes with yarn.lock.
      # This trims the OLDEST `.nx/cache` entries until the directory fits the budget, right before the cache
      # POST step reads it: nothing the build needs is touched (nx recomputes a missing entry), the yarn cache
      # is left alone, and the step can never fail a build. Set repo/org var DESKTOP_CACHE_MAX_MB to another
      # size in MB, or to 0 to disable the trim. Node is used instead of `find -printf` (GNU-only: it would
      # silently do nothing on the macOS runners).
      - name: Bound the CI cache before it is saved
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DESKTOP_CACHE_MAX_MB: ${{ vars.DESKTOP_CACHE_MAX_MB }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const limitMb = Number(process.env.DESKTOP_CACHE_MAX_MB || 2048);
            const dir = ".nx/cache";
            if (!limitMb) { console.log("DESKTOP_CACHE_MAX_MB=0 - trim disabled"); process.exit(0); }
            if (!fs.existsSync(dir)) { console.log("no " + dir + " - nothing to trim"); process.exit(0); }
            const sizeOf = (p) => {
              let total = 0;
              const stack = [p];
              while (stack.length) {
                const cur = stack.pop();
                let st; try { st = fs.lstatSync(cur); } catch { continue; }
                if (st.isDirectory()) { for (const n of fs.readdirSync(cur)) stack.push(path.join(cur, n)); }
                else total += st.size;
              }
              return total;
            };
            const limit = limitMb * 1024 * 1024;
            const entries = fs.readdirSync(dir).map((n) => {
              const p = path.join(dir, n);
              let mtime = 0; try { mtime = fs.lstatSync(p).mtimeMs; } catch {}
              return { p, mtime, size: sizeOf(p) };
            });
            let total = entries.reduce((a, e) => a + e.size, 0);
            const mb = (b) => Math.round(b / 1048576);
            console.log(dir + " is " + mb(total) + " MB in " + entries.length + " entries (budget " + limitMb + " MB)");
            if (total <= limit) { console.log("within budget - nothing to do"); process.exit(0); }
            entries.sort((a, b) => a.mtime - b.mtime);
            let removed = 0;
            for (const e of entries) {
              if (total <= limit) break;
              try { fs.rmSync(e.p, { recursive: true, force: true }); total -= e.size; removed++; } catch {}
            }
            console.log("trimmed " + removed + " oldest entries; " + dir + " is now " + mb(total) + " MB");
          '

  release-windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: [[self-hosted, Windows, X64]]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: "ever-co/ever-gauzy"
          ref: master
          clean: false

      # The self-hosted Windows runners resolve `shell: bash` by a plain PATH lookup (actions/runner
      # ScriptHandler → Which("bash")). On EVERGR that finds WSL's C:\Windows\System32\bash.exe first
      # and every bash step dies with "Running WSL as local system is not supported" (run 32058756571,
      # "Configure Registry"); the EVERDESK boxes have no WSL launcher so Git Bash wins there. Prepending
      # Git for Windows' bin (found via git.exe, which checkout already needs) to GITHUB_PATH makes the
      # lookup deterministic on every box. No-op when Git Bash is not installed.
      - name: Prefer Git Bash for bash steps
        shell: powershell
        run: |
          $git = (Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if ($git) {
            $bin = Join-Path (Split-Path (Split-Path $git -Parent) -Parent) 'bin'
            if (Test-Path (Join-Path $bin 'bash.exe')) {
              $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "Prepended $bin to PATH for later steps"
            } else { Write-Host "No bash.exe under $bin - leaving PATH alone" }
          } else { Write-Host 'git.exe not on PATH - leaving PATH alone' }

      - name: Selective cleanup (preserve .nx/cache)
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # Stop NX daemon first to release file locks before cleanup (guard for fresh runners without Node)
          if (Get-Command npx -ErrorAction SilentlyContinue) { npx nx daemon --stop 2>&1 | Out-Null }
          # Remove build artifacts but keep NX cache for faster rebuilds
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          exit 0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install Visual Studio 2022 Build Tools (VCTools)
        shell: powershell
        run: |
          choco install -y visualstudio2022buildtools --execution-timeout=21600 --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --norestart"

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fix node-gyp and Python
        # The self-hosted Windows pool is heterogeneous: EVERDESK* expose `python3`, EVERGR only `python`
        # ("The term 'python3' is not recognized", run 32048487421), and PowerShell 5.1 (EVERDESK) has no
        # `||`. Discover the interpreter the same way "Configure npm python for node-gyp" below does
        # (python.exe first — the Windows Store `python3.exe` alias stub would open the Store and fail).
        shell: powershell
        run: |
          $py = Get-Command python.exe, python3.exe, py.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $py) { throw "No Python interpreter (python.exe / python3.exe / py.exe) on PATH" }
          Write-Host "python is: $($py.Source)"
          if ($py.Name -ieq 'py.exe') { & $py.Source -3 -m pip install packaging setuptools } else { & $py.Source -m pip install packaging setuptools }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSVC (VS 2022 dev env)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install latest version of NPM
        run: 'npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      # yarn 1 rebuilds native modules with `npm_config_node_gyp` and, when it is unset, defaults to the
      # npm-BUNDLED copy <node>/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js. After the
      # `npm install -g npm@…` step above that file no longer exists on some self-hosted boxes (EVERDESK4:
      # "Cannot find module …/npm/node_modules/node-gyp/bin/node-gyp.js" while electron-builder rebuilt
      # better-sqlite3, run 32087030551) but does on others (EVERDESK3). Point it at the node-gyp@10.2.0
      # that was just installed globally so every runner in the pool behaves the same.
      - name: Configure npm node-gyp path
        shell: powershell
        run: |
          $root = (npm root -g).Trim()
          $gyp = Join-Path $root 'node-gyp\bin\node-gyp.js'
          if (Test-Path $gyp) {
            "npm_config_node_gyp=$gyp" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "node-gyp is: $gyp"
          } else { Write-Host "global node-gyp not found at $gyp - leaving the yarn default" }

      - name: Configure npm python for node-gyp
        shell: powershell
        run: |
          $py = (Get-Command python.exe).Source
          Write-Host "python is: $py"
          "npm_config_python=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$py"            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@aa4ee19926fabcf820aa1294385a76aec6bdb548
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: 'true'

      - name: Install Yarn dependencies
        # yarn 1 does NOT retry a failed git-dependency tarball fetch, so one transient
        # `codeload.github.com/... : Request failed "429 Too Many Requests"` (the fleet shares a single
        # egress IP and GitHub throttles it whenever several jobs install at once) throws away a build
        # that is already 40+ minutes in — it killed release-linux twice on 2026-08-18 (runs 32101473424,
        # 32139317563), each time with nothing wrong in the repo. Retry with a linear back-off instead.
        # bash (not the Windows default shell) so the loop is identical on every runner; Git Bash is put
        # on PATH by the "Prefer Git Bash for bash steps" step above.
        shell: bash
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: |
          install() { yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts; }
          for attempt in 1 2 3 4; do
            if install; then exit 0; fi
            if [ "$attempt" = 4 ]; then
              echo "::error title=yarn install::failed 4 times - this is very unlikely to be transient"
              exit 1
            fi
            wait=$((attempt * 60))
            echo "::warning title=yarn install retry::attempt ${attempt} failed (usually a codeload/registry 429) - retrying in ${wait}s"
            sleep "$wait"
          done

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version desktop timer app
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.desktopTimer(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_NAME: 'ever-teams-desktop'
          DESKTOP_TIMER_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"

      - name: Fix Node.js PATH for child processes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $nodePath = Split-Path $nodeExe -Parent
          $npmGlobalBin = & npm config get prefix
          $localBin = Join-Path $PWD "node_modules\.bin"
          $yarnCmd = Get-Command yarn -ErrorAction SilentlyContinue
          $yarnPath = if ($yarnCmd) { Split-Path $yarnCmd.Source -Parent } else { "" }

          $npmNodeExe = Join-Path $npmGlobalBin "node.exe"
          if (-not (Test-Path $npmNodeExe)) { Copy-Item $nodeExe $npmNodeExe -Force }

          $localNodeExe = Join-Path $localBin "node.exe"
          if (-not (Test-Path $localNodeExe)) { Copy-Item $nodeExe $localNodeExe -Force }

          $newPath = "$nodePath;$npmGlobalBin;$localBin;$yarnPath;$($env:PATH)"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @($nodePath, $npmGlobalBin, $localBin, $yarnPath) | Where-Object { $_ } | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          "NODE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = $newPath
          [System.Environment]::SetEnvironmentVariable("PATH", $newPath, "Process")

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Increase file handle limits
        shell: powershell
        run: |
          # Increase Node.js UV threadpool for parallel I/O (default is 4)
          "UV_THREADPOOL_SIZE=32" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Patch graceful-fs to retry EMFILE errors with backoff
          node -e "try { var gfs = require('graceful-fs'); gfs.gracefulify(require('fs')); console.log('graceful-fs patched'); } catch(e) { console.log('graceful-fs not available, skipping'); }"

      - name: Reset NX
        shell: powershell
        run: npx nx reset

      # See release-linux: the upstream bump script re-injects the dead DigitalOcean Spaces publisher
      # (bucket `ever` returns NoSuchBucket, which fails the whole publish after the GitHub upload).
      - name: Drop DigitalOcean Spaces publish target
        if: ${{ vars.DO_ENABLED != 'true' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/desktop-timer/src/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const current = (pkg.build && pkg.build.publish) || [];
            const list = Array.isArray(current) ? current : [current];
            const kept = list.filter((p) => !(p && p.provider === "spaces"));
            if (kept.length !== list.length) {
              pkg.build.publish = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
              console.log("Removed spaces publish target; remaining publishers:", JSON.stringify(kept));
            } else {
              console.log("No spaces publish target present; nothing to do");
            }
          '

      # See release-linux: the icon URLs on ever.team are dead (this is what killed the Windows build
      # with "image: unknown format" from app-builder); fetch the branding PNGs from this repo instead.
      - name: Fetch Ever Teams branding assets
        shell: bash
        env:
          BRANDING_BASE_URL: ${{ vars.DESKTOP_BRANDING_BASE_URL || 'https://raw.githubusercontent.com/ever-co/ever-teams/develop' }}
        run: |
          set -euo pipefail
          dest="apps/desktop-timer/src/assets/branding"
          # src/icons is generated (gitignored upstream) and is fully rewritten by gauzy's icon
          # generator; recreate it empty so a stale HTML-as-.png left by an earlier failed run on a
          # persistent (clean: false) runner cannot be picked up, and because gauzy's https download
          # strategy used to create the directory while the local-asset strategy does not.
          rm -rf apps/desktop-timer/src/icons
          mkdir -p "$dest" apps/desktop-timer/src/icons
          fetch() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$2" "$1"
            if [ "$(head -c 8 "$2" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::$1 is not a PNG: $(head -c 120 "$2" | tr -d '\r\n')"
              exit 1
            fi
            echo "fetched $1 -> $2 ($(wc -c < "$2") bytes)"
          }
          fetch "$BRANDING_BASE_URL/apps/mobile/assets/images/app-icon-ios-ever-teams.png" "$dest/ever-teams-512x512.png"
          fetch "$BRANDING_BASE_URL/apps/web/public/assets/ever-teams.png" "$dest/ever-teams.png"

      - name: Build Desktop Timer App
        shell: cmd
        run: 'yarn build:desktop-timer:windows:release:gh:x64'
        env:
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          DO_KEY_ID: ${{ secrets.DO_KEY_ID }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          NX_NO_CLOUD: true
          NX_PLUGIN_NO_TIMEOUTS: true
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"
          DESKTOP_TIMER_APP_REPO_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_OWNER: "ever-co"
          DESKTOP_TIMER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_TIMER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          # Translations: apps/desktop/i18n no longer exists in this repo (removed in the 2026-06-06
          # "next" commit), so every download from the old URL 404s and gauzy's translation-util then
          # leaves apps/desktop-timer/src/assets/i18n EMPTY (it only copies its bundled defaults when
          # the URL is unset) — the shipped app would show raw i18n keys. Leave the URL empty so gauzy's
          # complete ui-core translations are bundled; set repo/org var DESKTOP_I18N_FILES_URL to a
          # folder of Ever Teams-specific <lang>.json files to override (previous value:
          # https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/desktop/i18n).
          I18N_FILES_URL: ${{ vars.DESKTOP_I18N_FILES_URL }}
          # Local copies made by the "Fetch Ever Teams branding assets" step (paths are relative to
          # apps/desktop-timer/src, the same form as gauzy's own defaults). Previously the dead
          # https://ever.team/assets/ever-teams.png and .../ever-teams-512x512.png.
          PLATFORM_LOGO: "assets/branding/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "assets/branding/ever-teams-512x512.png"

  release-windows-arm64:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: [windows-11-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: "ever-co/ever-gauzy"
          ref: master
          clean: false


      # Same PATH determinism as the x64 Windows job: today this leg runs on the GitHub-hosted
      # windows-11-arm image where `shell: bash` already resolves to Git Bash, but if an arm64 runner is
      # ever self-hosted (RUNNER_LINUX_ARM64_8 / a Windows arm64 box) it could resolve to WSL and fail as
      # EVERGR did. No-op when Git Bash is not installed.
      - name: Prefer Git Bash for bash steps
        shell: powershell
        run: |
          $git = (Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if ($git) {
            $bin = Join-Path (Split-Path (Split-Path $git -Parent) -Parent) 'bin'
            if (Test-Path (Join-Path $bin 'bash.exe')) {
              $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "Prepended $bin to PATH for later steps"
            } else { Write-Host "No bash.exe under $bin - leaving PATH alone" }
          } else { Write-Host 'git.exe not on PATH - leaving PATH alone' }
      - name: Selective cleanup (preserve .nx/cache)
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # Stop NX daemon first to release file locks before cleanup (guard for fresh runners without Node)
          if (Get-Command npx -ErrorAction SilentlyContinue) { npx nx daemon --stop 2>&1 | Out-Null }
          # Remove build artifacts but keep NX cache for faster rebuilds
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          exit 0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          architecture: arm64

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Install Visual Studio 2022 Build Tools (VCTools with ARM64)
        shell: powershell
        run: |
          choco install -y visualstudio2022buildtools --execution-timeout=21600 --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --includeRecommended --passive --norestart"

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fix node-gyp and Python
        # The self-hosted Windows pool is heterogeneous: EVERDESK* expose `python3`, EVERGR only `python`
        # ("The term 'python3' is not recognized", run 32048487421), and PowerShell 5.1 (EVERDESK) has no
        # `||`. Discover the interpreter the same way "Configure npm python for node-gyp" below does
        # (python.exe first — the Windows Store `python3.exe` alias stub would open the Store and fail).
        shell: powershell
        run: |
          $py = Get-Command python.exe, python3.exe, py.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $py) { throw "No Python interpreter (python.exe / python3.exe / py.exe) on PATH" }
          Write-Host "python is: $($py.Source)"
          if ($py.Name -ieq 'py.exe') { & $py.Source -3 -m pip install packaging setuptools } else { & $py.Source -m pip install packaging setuptools }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSVC (VS 2022 dev env)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install latest version of NPM
        run: 'npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      # yarn 1 rebuilds native modules with `npm_config_node_gyp` and, when it is unset, defaults to the
      # npm-BUNDLED copy <node>/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js. After the
      # `npm install -g npm@…` step above that file no longer exists on some self-hosted boxes (EVERDESK4:
      # "Cannot find module …/npm/node_modules/node-gyp/bin/node-gyp.js" while electron-builder rebuilt
      # better-sqlite3, run 32087030551) but does on others (EVERDESK3). Point it at the node-gyp@10.2.0
      # that was just installed globally so every runner in the pool behaves the same.
      - name: Configure npm node-gyp path
        shell: powershell
        run: |
          $root = (npm root -g).Trim()
          $gyp = Join-Path $root 'node-gyp\bin\node-gyp.js'
          if (Test-Path $gyp) {
            "npm_config_node_gyp=$gyp" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "node-gyp is: $gyp"
          } else { Write-Host "global node-gyp not found at $gyp - leaving the yarn default" }

      - name: Configure npm python for node-gyp
        shell: powershell
        run: |
          $py = (Get-Command python.exe).Source
          Write-Host "python is: $py"
          "npm_config_python=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$py"            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Registry
        shell: bash
        run: |
          if [ -n "${{ secrets.VERDACCIO_TOKEN }}" ]; then
            echo "//packages.ever.co/:_authToken=${{ secrets.VERDACCIO_TOKEN }}" >> .npmrc
            echo "registry=https://packages.ever.co/" >> .npmrc
          fi

      - name: Install Yarn dependencies
        # yarn 1 does NOT retry a failed git-dependency tarball fetch, so one transient
        # `codeload.github.com/... : Request failed "429 Too Many Requests"` (the fleet shares a single
        # egress IP and GitHub throttles it whenever several jobs install at once) throws away a build
        # that is already 40+ minutes in — it killed release-linux twice on 2026-08-18 (runs 32101473424,
        # 32139317563), each time with nothing wrong in the repo. Retry with a linear back-off instead.
        # bash (not the Windows default shell) so the loop is identical on every runner; Git Bash is put
        # on PATH by the "Prefer Git Bash for bash steps" step above.
        shell: bash
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: |
          install() { yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts; }
          for attempt in 1 2 3 4; do
            if install; then exit 0; fi
            if [ "$attempt" = 4 ]; then
              echo "::error title=yarn install::failed 4 times - this is very unlikely to be transient"
              exit 1
            fi
            wait=$((attempt * 60))
            echo "::warning title=yarn install retry::attempt ${attempt} failed (usually a codeload/registry 429) - retrying in ${wait}s"
            sleep "$wait"
          done

      # sharp < 0.33 ships no win32-arm64 prebuilt and falls back to a node-gyp build that needs a
      # system libvips ("Cannot open include file: 'vips/vips8'"). The monorepo carries such a copy
      # ONLY as a nested, MOBILE-only dependency (react-native-bootsplash -> sharp@0.32.6), but
      # electron-builder's install-app-deps (root `postinstall.manual` AND the installAppDeps it runs
      # again inside the app build) rebuilds every module *named* like an app dependency anywhere in
      # node_modules, so that nested copy killed every ARM64 build (run 32038575750, failedTask=
      # installAppDeps). Nothing built here imports it: the apps use the hoisted sharp >= 0.34, whose
      # win32-arm64 binary is a plain optional package (@img/sharp-win32-arm64). Drop only nested
      # sharp copies older than 0.33 from this CI checkout (nothing in the repo changes; x64 and mac
      # runners have prebuilts and are left alone).
      - name: Drop nested sharp < 0.33 (no win32-arm64 prebuilt)
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const roots = ["node_modules"];
            const found = [];
            const scan = (dir, depth) => {
              if (depth > 3 || !fs.existsSync(dir)) return;
              for (const name of fs.readdirSync(dir)) {
                const p = path.join(dir, name);
                if (name.startsWith("@")) { scan(p, depth); continue; }
                const nested = path.join(p, "node_modules", "sharp", "package.json");
                if (fs.existsSync(nested)) found.push(path.dirname(nested));
                const deeper = path.join(p, "node_modules");
                if (fs.existsSync(deeper)) scan(deeper, depth + 1);
              }
            };
            for (const r of roots) scan(r, 0);
            let dropped = 0;
            for (const dir of found) {
              const v = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8")).version || "0.0.0";
              const [maj, min] = v.split(".").map(Number);
              if (maj === 0 && min < 33) { fs.rmSync(dir, { recursive: true, force: true }); dropped++; console.log("dropped " + dir + " (sharp@" + v + ")"); }
              else console.log("kept " + dir + " (sharp@" + v + ")");
            }
            console.log("nested sharp copies: " + found.length + ", dropped: " + dropped);
          '

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version desktop timer app
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.desktopTimer(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_NAME: 'ever-teams-desktop'
          DESKTOP_TIMER_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"

      - name: Fix Node.js PATH for child processes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $nodePath = Split-Path $nodeExe -Parent
          $npmGlobalBin = & npm config get prefix
          $localBin = Join-Path $PWD "node_modules\.bin"
          $yarnCmd = Get-Command yarn -ErrorAction SilentlyContinue
          $yarnPath = if ($yarnCmd) { Split-Path $yarnCmd.Source -Parent } else { "" }

          $npmNodeExe = Join-Path $npmGlobalBin "node.exe"
          if (-not (Test-Path $npmNodeExe)) { Copy-Item $nodeExe $npmNodeExe -Force }

          $localNodeExe = Join-Path $localBin "node.exe"
          if (-not (Test-Path $localNodeExe)) { Copy-Item $nodeExe $localNodeExe -Force }

          $newPath = "$nodePath;$npmGlobalBin;$localBin;$yarnPath;$($env:PATH)"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @($nodePath, $npmGlobalBin, $localBin, $yarnPath) | Where-Object { $_ } | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          "NODE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = $newPath
          [System.Environment]::SetEnvironmentVariable("PATH", $newPath, "Process")

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Increase file handle limits
        shell: powershell
        run: |
          # Increase Node.js UV threadpool for parallel I/O (default is 4)
          "UV_THREADPOOL_SIZE=32" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Patch graceful-fs to retry EMFILE errors with backoff
          node -e "try { var gfs = require('graceful-fs'); gfs.gracefulify(require('fs')); console.log('graceful-fs patched'); } catch(e) { console.log('graceful-fs not available, skipping'); }"

      # See release-linux: the upstream bump script re-injects the dead DigitalOcean Spaces publisher
      # (bucket `ever` returns NoSuchBucket, which fails the whole publish after the GitHub upload).
      - name: Drop DigitalOcean Spaces publish target
        if: ${{ vars.DO_ENABLED != 'true' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/desktop-timer/src/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const current = (pkg.build && pkg.build.publish) || [];
            const list = Array.isArray(current) ? current : [current];
            const kept = list.filter((p) => !(p && p.provider === "spaces"));
            if (kept.length !== list.length) {
              pkg.build.publish = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
              console.log("Removed spaces publish target; remaining publishers:", JSON.stringify(kept));
            } else {
              console.log("No spaces publish target present; nothing to do");
            }
          '

      # See release-linux: the icon URLs on ever.team are dead (this is what killed the Windows build
      # with "image: unknown format" from app-builder); fetch the branding PNGs from this repo instead.
      - name: Fetch Ever Teams branding assets
        shell: bash
        env:
          BRANDING_BASE_URL: ${{ vars.DESKTOP_BRANDING_BASE_URL || 'https://raw.githubusercontent.com/ever-co/ever-teams/develop' }}
        run: |
          set -euo pipefail
          dest="apps/desktop-timer/src/assets/branding"
          # src/icons is generated (gitignored upstream) and is fully rewritten by gauzy's icon
          # generator; recreate it empty so a stale HTML-as-.png left by an earlier failed run on a
          # persistent (clean: false) runner cannot be picked up, and because gauzy's https download
          # strategy used to create the directory while the local-asset strategy does not.
          rm -rf apps/desktop-timer/src/icons
          mkdir -p "$dest" apps/desktop-timer/src/icons
          fetch() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$2" "$1"
            if [ "$(head -c 8 "$2" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::$1 is not a PNG: $(head -c 120 "$2" | tr -d '\r\n')"
              exit 1
            fi
            echo "fetched $1 -> $2 ($(wc -c < "$2") bytes)"
          }
          fetch "$BRANDING_BASE_URL/apps/mobile/assets/images/app-icon-ios-ever-teams.png" "$dest/ever-teams-512x512.png"
          fetch "$BRANDING_BASE_URL/apps/web/public/assets/ever-teams.png" "$dest/ever-teams.png"

      - name: Build Desktop Timer App
        shell: cmd
        run: yarn build:desktop-timer:windows:release:gh:arm64
        env:
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          DO_KEY_ID: ${{ secrets.DO_KEY_ID }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          NX_NO_CLOUD: true
          NX_PLUGIN_NO_TIMEOUTS: true
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_TIMER_APP_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_DESCRIPTION: "Ever Teams Desktop"
          DESKTOP_TIMER_APP_ID: "com.ever.everteamsdesktop"
          DESKTOP_TIMER_APP_REPO_NAME: "ever-teams-desktop"
          DESKTOP_TIMER_APP_REPO_OWNER: "ever-co"
          DESKTOP_TIMER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_TIMER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          # Translations: apps/desktop/i18n no longer exists in this repo (removed in the 2026-06-06
          # "next" commit), so every download from the old URL 404s and gauzy's translation-util then
          # leaves apps/desktop-timer/src/assets/i18n EMPTY (it only copies its bundled defaults when
          # the URL is unset) — the shipped app would show raw i18n keys. Leave the URL empty so gauzy's
          # complete ui-core translations are bundled; set repo/org var DESKTOP_I18N_FILES_URL to a
          # folder of Ever Teams-specific <lang>.json files to override (previous value:
          # https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/desktop/i18n).
          I18N_FILES_URL: ${{ vars.DESKTOP_I18N_FILES_URL }}
          # Local copies made by the "Fetch Ever Teams branding assets" step (paths are relative to
          # apps/desktop-timer/src, the same form as gauzy's own defaults). Previously the dead
          # https://ever.team/assets/ever-teams.png and .../ever-teams-512x512.png.
          PLATFORM_LOGO: "assets/branding/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "assets/branding/ever-teams-512x512.png"

      # The yarn + .nx cache these jobs share has grown to ~9.5 GB: every job spends ~10 min RESTORING it, and
      # when the key changes the POST step uploads all of it — on 2026-08-18 that upload stalled at 52% and
      # burned the whole 300-minute job budget, so `release-linux` was cancelled after 5 h with the app already
      # built (run 32101473424). `.nx/cache` grows forever because the cache key only changes with yarn.lock.
      # This trims the OLDEST `.nx/cache` entries until the directory fits the budget, right before the cache
      # POST step reads it: nothing the build needs is touched (nx recomputes a missing entry), the yarn cache
      # is left alone, and the step can never fail a build. Set repo/org var DESKTOP_CACHE_MAX_MB to another
      # size in MB, or to 0 to disable the trim. Node is used instead of `find -printf` (GNU-only: it would
      # silently do nothing on the macOS runners).
      - name: Bound the CI cache before it is saved
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DESKTOP_CACHE_MAX_MB: ${{ vars.DESKTOP_CACHE_MAX_MB }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const limitMb = Number(process.env.DESKTOP_CACHE_MAX_MB || 2048);
            const dir = ".nx/cache";
            if (!limitMb) { console.log("DESKTOP_CACHE_MAX_MB=0 - trim disabled"); process.exit(0); }
            if (!fs.existsSync(dir)) { console.log("no " + dir + " - nothing to trim"); process.exit(0); }
            const sizeOf = (p) => {
              let total = 0;
              const stack = [p];
              while (stack.length) {
                const cur = stack.pop();
                let st; try { st = fs.lstatSync(cur); } catch { continue; }
                if (st.isDirectory()) { for (const n of fs.readdirSync(cur)) stack.push(path.join(cur, n)); }
                else total += st.size;
              }
              return total;
            };
            const limit = limitMb * 1024 * 1024;
            const entries = fs.readdirSync(dir).map((n) => {
              const p = path.join(dir, n);
              let mtime = 0; try { mtime = fs.lstatSync(p).mtimeMs; } catch {}
              return { p, mtime, size: sizeOf(p) };
            });
            let total = entries.reduce((a, e) => a + e.size, 0);
            const mb = (b) => Math.round(b / 1048576);
            console.log(dir + " is " + mb(total) + " MB in " + entries.length + " entries (budget " + limitMb + " MB)");
            if (total <= limit) { console.log("within budget - nothing to do"); process.exit(0); }
            entries.sort((a, b) => a.mtime - b.mtime);
            let removed = 0;
            for (const e of entries) {
              if (total <= limit) break;
              try { fs.rmSync(e.p, { recursive: true, force: true }); total -= e.size; removed++; } catch {}
            }
            console.log("trimmed " + removed + " oldest entries; " + dir + " is now " + mb(total) + " MB");
          '
