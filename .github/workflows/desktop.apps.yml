        run: |
          set -euo pipefail
          dest="apps/desktop-timer/src/assets/branding"
          # src/icons is generated (gitignored upstream) and is fully rewritten by gauzy's icon
          # generator; recreate it empty so a stale HTML-as-.png left by an earlier failed run on a
          # persistent (clean: false) runner cannot be picked up, and because gauzy's https download
          # strategy used to create the directory while the local-asset strategy does not.
          rm -rf apps/desktop-timer/src/icons
          mkdir -p "$dest" apps/desktop-timer/src/icons
          fetch() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$2" "$1"
            if [ "$(head -c 8 "$2" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::$1 is not a PNG: $(head -c 120 "$2" | tr -d '\r\n')"
              exit 1
            fi
            echo "fetched $1 -> $2 ($(wc -c < "$2") bytes)"
          }
          fetch "$BRANDING_BASE_URL/apps/mobile/assets/images/app-icon-ios-ever-teams.png" "$dest/ever-teams-512x512.png"
          fetch "$BRANDING_BASE_URL/apps/web/public/assets/ever-teams.png" "$dest/ever-teams.png"

      - name: Ensure dist directory exists
        shell: bash
