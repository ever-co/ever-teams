name: Mobile Build Before Merge
on:
  # Feature and fix PRs into develop deliberately run no CI (cost). This build runs on the promotion PRs
  # (develop -> stage, stage -> main) and on demand for any branch through "Run workflow".
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [stage, main, master]
    paths:
      - ".github/workflows/mobile.before-merge.yml"
      - "apps/mobile/**"
      - "package.json"
      - "yarn.lock"
      # The EAS upload archive decides which workspaces get installed on the builder,
      # so a change to it changes the build as surely as a dependency bump does.
      - ".easignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Skip workflow if PR is from develop to main
        if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main'
        run: |
          echo "PR is from develop to main. Skipping the workflow."
          echo "::set-output name=skipped::true"
        id: skip_check

      - name: Check if skipped
        if: steps.skip_check.outputs.skipped == 'true'
        run: echo "Workflow was skipped" && exit 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: "yarn"

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@727973d766f3968d3f1184300af085872abcb20b
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install Packages
        run: |
          yarn install --network-timeout 1000000 --frozen-lockfile
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'
          # This job runs no Cypress: skip the binary download in cypress's postinstall, a network flake that failed
          # whole builds (the npm package and its types are still installed for the typecheck)
          CYPRESS_INSTALL_BINARY: '0'
          # This job does not build the server-web desktop app: skip its postinstall, whose nested yarn install
          # (electron-builder install-app-deps) follows apps/server-web/release/app/yarn.lock to the public registry
          # instead of the npm cache set up above, a network flake that failed whole builds (2026-11-18)
          SKIP_SERVER_WEB_POSTINSTALL: 'true'

      - name: Probe - server-web postinstall outputs (do not merge)
        shell: bash
        run: |
          set +e
          echo "PROBE install step flag: $(grep -o "SKIP_SERVER_WEB_POSTINSTALL: '[a-z]*'" .github/workflows/mobile.before-merge.yml)"
          if [ -d apps/server-web/release/app/node_modules ]; then
            echo 'PROBE release/app/node_modules EXISTS:' $(ls apps/server-web/release/app/node_modules apps/server-web/release/app/node_modules/@img 2>/dev/null)
          else
            echo 'PROBE release/app/node_modules ABSENT (install-app-deps did not run)'
          fi
          if [ -d apps/server-web/.erb/dll ]; then echo 'PROBE .erb/dll EXISTS:' $(ls apps/server-web/.erb/dll); else echo 'PROBE .erb/dll ABSENT (build:dll did not run)'; fi
          cache=$(yarn cache dir 2>/dev/null)
          for m in "$cache"/npm-@img-sharp-linux-x64-0.35.4-*/node_modules/@img/sharp-linux-x64/.yarn-metadata.json "$cache"/npm-sharp-0.35.4-*/node_modules/sharp/.yarn-metadata.json; do
            [ -f "$m" ] && echo "PROBE yarn cache entry $m fetched from: $(node -e 'console.log(require(process.argv[1]).remote.resolved)' "$m")"
          done
          exit 0

      - name: Build Mobile
        run: |
          yarn build:mobile
