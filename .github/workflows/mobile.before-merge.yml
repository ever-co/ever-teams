name: Mobile Build Before Merge
on:
  # Feature and fix PRs into develop deliberately run no CI (cost). This build runs on the promotion PRs
  # (develop -> stage, stage -> main) and on demand for any branch through "Run workflow".
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [stage, main, master]
    paths:
      - ".github/workflows/mobile.before-merge.yml"
      - "apps/mobile/**"
      - "package.json"
      - "yarn.lock"
      # The EAS upload archive decides which workspaces get installed on the builder,
      # so a change to it changes the build as surely as a dependency bump does.
      - ".easignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Skip workflow if PR is from develop to main
        if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main'
        run: |
          echo "PR is from develop to main. Skipping the workflow."
          echo "::set-output name=skipped::true"
        id: skip_check

      - name: Check if skipped
        if: steps.skip_check.outputs.skipped == 'true'
        run: echo "Workflow was skipped" && exit 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: "yarn"

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@727973d766f3968d3f1184300af085872abcb20b
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install Packages
        run: |
          yarn install --network-timeout 1000000 --frozen-lockfile
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'
          # This job runs no Cypress: skip the binary download in cypress's postinstall, a network flake that failed
          # whole builds (the npm package and its types are still installed for the typecheck)
          CYPRESS_INSTALL_BINARY: '0'

      - name: Build Mobile
        run: |
          yarn build:mobile
