name: Release Ever Teams SDK to npm
# cspell:words elif

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled: two runs reading the same npm version would compute the same next
# version, and the second publish would skip it. A run waits for the one in progress, and `queue: max` keeps every
# waiting push (up to 100) instead of the default single pending run, so no push's changes are dropped.
concurrency:
  group: release-sdk-npm
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Version and SDK Publish with Changesets
    # Prefer the -8 ARC pool: its RAM-backed volumes are work=24Gi + package cache=12Gi.
    # The -4 pool (work=16Gi, cache=8Gi) is measurably too small for this repo's full
    # `yarn install` — yarn 1 downloads every platform variant of the optional native
    # deps (electron, @sentry/cli-*, @img/sharp-*), and run 32514096730 (2026-08-21)
    # died with "ENOSPC: no space left on device" while extracting into the 8Gi cache
    # tmpfs. Same ENOSPC hit web.before-merge.yml on the -4 pool the same day, on a run
    # that installs straight from registry.yarnpkg.com — pool capacity, not registry.
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    permissions:
      contents: write # for changelog/version PRs
      pull-requests: write # the version bump goes to develop as a pull request
      packages: write
      id-token: write # for trusted publishing (future use)

    env:
      # setup-node (with `registry-url`) writes $RUNNER_TEMP/.npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and points
      # NPM_CONFIG_USERCONFIG at it for EVERY later step. Yarn 1 reads that file
      # and does strict env substitution, so if NODE_AUTH_TOKEN is unset the very
      # first `yarn install` dies with "Failed to replace env in config:
      # ${NODE_AUTH_TOKEN}" (chronic failure of this workflow). Export the token
      # job-wide so install/build/version/publish all resolve it — the publish
      # step already relied on it, this only widens its scope, never weakens it.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # GH_BRANCH_TOKEN is not set (owner 2026-10-26: no token that pushes past main's PR rule): with
          # GITHUB_TOKEN this job pushes only its bump branch and the release tags, never main.
          token: ${{ secrets.GH_BRANCH_TOKEN || secrets.GITHUB_TOKEN }}
          # Fetch full history for changesets
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          registry-url: 'https://registry.npmjs.org'
          # NOTE: setup-node >= v4 dropped the `always-auth` input — the runner
          # logs "Unexpected input(s) 'always-auth'" as a WARNING only (not
          # fatal). Auth is carried by NODE_AUTH_TOKEN (job env above) via the
          # .npmrc that setup-node writes; `always-auth=true` is also written
          # by "Configure NPM Authentication" below. Kept for intent.
          always-auth: true

      - name: Verify NPM Token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "❌ NPM_TOKEN secret is not set"
            echo "Please configure a granular NPM access token in GitHub secrets"
            exit 1
          fi
          echo "✅ NPM_TOKEN secret is configured"

      - name: Configure NPM Authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          echo "@ever-teams:registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "✅ NPM authentication configured"

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@727973d766f3968d3f1184300af085872abcb20b
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_8 != '' || vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies (Yarn)
        # The install needs no npm token, so it reads an empty user config instead of setup-node's .npmrc
        # (`_authToken=${NODE_AUTH_TOKEN}`): server-web's postinstall (`electron-builder install-app-deps`) runs a
        # nested yarn install whose env electron-builder 26 strips of token-like variables on Linux, so that nested
        # yarn failed with "Failed to replace env in config: ${NODE_AUTH_TOKEN}" (run 40276689546). Publishing
        # later still uses setup-node's .npmrc and the job-wide NODE_AUTH_TOKEN.
        run: |
          : > "$RUNNER_TEMP/install.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/install.npmrc" yarn install --frozen-lockfile
        env:
          # This job builds and publishes the SDK and runs no Cypress: skip the binary download in cypress's
          # postinstall (a large download over the public network, outside Verdaccio). It failed this install on
          # 2026-10-26 (run 40252197246), as it had the web and mobile jobs before they got the same setting.
          CYPRESS_INSTALL_BINARY: '0'

      - name: Restore registry config (keep the checkout npmjs-clean)
        # Configure Registry above may rewrite yarn.lock and append registry lines
        # to the tracked .npmrc/.yarnrc so the install resolves through the internal
        # Verdaccio cache. Later steps run `git add .` + push version bumps and then
        # publish to npmjs - a committed rewritten lockfile or a leftover project-level
        # registry= line pointing at a LAN VIP must never survive past the install.
        # Tracked files are restored; untracked leftovers are removed.
        if: always()
        run: |
          for f in yarn.lock .npmrc .yarnrc; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git checkout -- "$f"
            else
              rm -f "$f"
            fi
          done
          rm -f yarn.lock.rewritten package-lock.json.rewritten

      - name: Build SDK packages
        run: |
          # Build the publishable packages (the private @ever-teams/types is bundled
          # from source by the others, so it is intentionally not built/published here).
          echo "Building toolkit-types package..."
          yarn build:toolkit-types
          echo "Building API package..."
          yarn build:api
          echo "Building Toolkit UI package..."
          yarn build:toolkit-ui
          echo "Building atoms package..."
          yarn build:atoms
          echo "Building tracking package..."
          yarn build:tracking
          echo "✅ All publishable SDK packages built successfully"

      # A bump PR takes a while to reach main, and until then main still carries the changesets that bump consumed.
      # Applying them again would cut another release with no new change. Each published release tag points at its
      # bump commit, which deleted the changesets it consumed: those files are dropped here before anything counts them.
      - name: Drop changesets an earlier bump already published
        run: |
          marker='ci: sdk version bump via changeset'
          # A bump commit counts as published only when every package version it bumped has its release tag: after a
          # partial publish its changesets stay, so a re-run finishes the release.
          fully_published() {
            local f id
            for f in $(git diff-tree --no-commit-id --name-only -r "$1" -- 'packages/**/package.json' 2>/dev/null); do
              id=$(git show "$1:$f" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);process.stdout.write(p.name+"@"+p.version)})')
              git rev-parse -q --verify "refs/tags/$id" >/dev/null || return 1
            done
            return 0
          }
          bumps=$(for tag in $(git tag --list '@ever-teams/*@*'); do
            # Explicit ifs, not `a && b`: a non-matching last tag must not fail the loop (and so the step under pipefail)
            if git log -1 --format=%s "$tag" 2>/dev/null | grep -qiF "$marker"; then git rev-parse "$tag^{commit}"; fi
          done | sort -u)
          consumed=$(for c in $bumps; do
            if fully_published "$c"; then git show --diff-filter=D --name-only --format= "$c" -- .changeset/ 2>/dev/null; fi
          done | sort -u)
          for f in $consumed; do
            if [ -f "$f" ]; then
              echo "🧹 $f was already released by an earlier bump (its PR has not reached main yet): not applying it again"
              rm -f "$f"
            fi
          done

      - name: Auto-generate changesets for changed SDK packages
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          echo "🔍 Detecting changed SDK packages..."

          # Define publishable SDK packages and their paths
          declare -A SDK_PACKAGES=(
            ["packages/toolkit/atoms"]="@ever-teams/atoms"
            ["packages/toolkit/tracking"]="@ever-teams/tracking"
            ["packages/api"]="@ever-teams/api"
            ["packages/toolkit-types"]="@ever-teams/toolkit-types"
            ["packages/toolkit-ui"]="@ever-teams/toolkit-ui"
          )

          CHANGED_PACKAGES=()

          # Determine the diff range to cover all commits in this push
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # Fallback for first push or workflow_dispatch
            DIFF_RANGE="HEAD~1..HEAD"
          else
            DIFF_RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "📏 Diff range: $DIFF_RANGE"

          # Only files that can change what npm ships count. Every SDK package publishes `dist` (built
          # from its sources) plus package.json/README/LICENSE; lint, format, test and story files never
          # reach the tarball, so a change to them alone must not cut a release. It did on 2026-10-20:
          # #4715 added eslint.config.mjs to toolkit-ui and atoms, and this step auto-bumped both.
          DEV_ONLY=(
            ':(exclude,glob)**/eslint.config.*' ':(exclude,glob)**/.eslintrc*' ':(exclude,glob)**/.eslintignore'
            ':(exclude,glob)**/.prettierrc*' ':(exclude,glob)**/.prettierignore'
            ':(exclude,glob)**/*.test.*' ':(exclude,glob)**/*.spec.*' ':(exclude,glob)**/__tests__/**'
            ':(exclude,glob)**/jest.config.*' ':(exclude,glob)**/vitest.config.*'
            ':(exclude,glob)**/*.stories.*' ':(exclude,glob)**/.storybook/**'
          )

          # This workflow's own version-bump commits (see "Open the version bump PR" below) reach main through
          # develop -> stage -> main and only change versions and changelogs: they must not count as package changes,
          # or every bump would cut a new release. They carry this marker in the commit subject and in the PR title,
          # so a squash-merged bump PR matches too.
          BUMP_MARKER='ci: sdk version bump via changeset'
          # A push that is already part of a fully published release must not release again. That covers a re-run
          # (it would publish the same code as the next patch) and a queued older run that starts after a newer one
          # (it would publish older code as a newer version). Such a push is an ancestor of (or is) the commit a
          # published bump commit was made on, and that bump has every one of its release tags.
          fully_published() {
            local f id
            for f in $(git diff-tree --no-commit-id --name-only -r "$1" -- 'packages/**/package.json' 2>/dev/null); do
              id=$(git show "$1:$f" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);process.stdout.write(p.name+"@"+p.version)})')
              git rev-parse -q --verify "refs/tags/$id" >/dev/null || return 1
            done
            return 0
          }
          for bump in $(for tag in $(git tag --list '@ever-teams/*@*'); do
            if git log -1 --format=%s "$tag" 2>/dev/null | grep -qiF "$BUMP_MARKER"; then git rev-parse "$tag^{commit}"; fi
          done | sort -u); do
            if git merge-base --is-ancestor "$AFTER_SHA" "$bump^" 2>/dev/null && fully_published "$bump"; then
              echo "ℹ️  This push is already in a published release (bump commit ${bump:0:8}): nothing to release again."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # A package counts as changed when the push makes a net change to it (a change reverted within the same
          # push does not count) AND that change comes from a commit other than a bump commit. Merge commits count
          # only for what they change beyond their parents (conflict resolutions), via the combined diff.
          COMMITS=$(git rev-list --parents "$DIFF_RANGE" 2>/dev/null || true)
          echo "🧾 Commits in the push: $(echo "$COMMITS" | { grep -c . || true; })"

          touched_outside_bumps() {
            local line commit parents
            while read -r line; do
              [ -z "$line" ] && continue
              commit=${line%% *}
              parents=$(echo "$line" | wc -w)
              if [ "$parents" -gt 2 ]; then
                # A changelog-only resolution (two pending bump PRs both adding entries) is release metadata, not SDK code
                [ -n "$(git diff-tree --cc --no-commit-id --name-only -r "$commit" -- "$@" ':(exclude,glob)**/CHANGELOG.md' 2>/dev/null)" ] && return 0
              elif ! git log -1 --format=%s "$commit" | grep -qiF "$BUMP_MARKER"; then
                [ -n "$(git diff-tree --no-commit-id --name-only -r "$commit" -- "$@" 2>/dev/null)" ] && return 0
              fi
            done <<< "$COMMITS"
            return 1
          }

          # Check each SDK package for changes in this push
          for pkg_path in "${!SDK_PACKAGES[@]}"; do
            pkg_name="${SDK_PACKAGES[$pkg_path]}"
            pkg_changed=""
            if ! git diff --quiet "$DIFF_RANGE" -- "$pkg_path" "${DEV_ONLY[@]}" 2>/dev/null \
              && touched_outside_bumps "$pkg_path" "${DEV_ONLY[@]}"; then
              pkg_changed=1
            fi
            if [ -z "$pkg_changed" ]; then
              echo "  ⏭️  No changes in $pkg_name ($pkg_path)"
            else
              echo "  ✅ Changes detected in $pkg_name ($pkg_path)"
              CHANGED_PACKAGES+=("$pkg_name")
            fi
          done

          # Check if any existing manual changesets already exist
          EXISTING_CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          if [ ${#CHANGED_PACKAGES[@]} -eq 0 ] && [ "$EXISTING_CHANGESETS" -eq 0 ]; then
            echo "ℹ️  No SDK package changes detected and no manual changesets found. Skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Generate a changeset file for changed packages (if any)
          if [ ${#CHANGED_PACKAGES[@]} -gt 0 ]; then
            CHANGESET_ID="auto-$(date +%s)-$(echo $RANDOM | md5sum | head -c 8)"
            CHANGESET_FILE=".changeset/${CHANGESET_ID}.md"

            echo "📝 Creating changeset: $CHANGESET_FILE"

            # Build the changeset frontmatter
            {
              echo "---"
              for pkg in "${CHANGED_PACKAGES[@]}"; do
                echo "\"${pkg}\": patch"
              done
              echo "---"
              echo ""
              echo "Auto-generated patch version bump for SDK changes"
            } > "$CHANGESET_FILE"

            echo ""
            echo "📄 Generated changeset contents:"
            cat "$CHANGESET_FILE"
          fi

          echo ""
          echo "🎉 Changeset generation complete!"
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Until a version bump PR has gone develop -> stage -> main, main still carries the old versions: bumping from
      # them would compute a version npm already has, and `changeset publish` would silently skip the new code. So
      # each SDK package starts from npm's latest version when npm is ahead (internal dependencies use `*` ranges,
      # so nothing else needs rewriting).
      - name: Start SDK versions from npm's latest
        if: steps.detect.outputs.release == 'true'
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const dirs = ['packages/toolkit/atoms', 'packages/toolkit/tracking', 'packages/api', 'packages/toolkit-types', 'packages/toolkit-ui'];
          const parts = (v) => v.split('-')[0].split('.').map(Number);
          const newer = (a, b) => { const [x, y] = [parts(a), parts(b)]; for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
          for (const dir of dirs) {
            const file = `${dir}/package.json`;
            const raw = fs.readFileSync(file, 'utf8');
            const pkg = JSON.parse(raw);
            let published = '';
            try {
              // npmjs explicitly: the tracked .npmrc points at the Yarn mirror, which can lag behind what was just published
              published = execFileSync('npm', ['view', pkg.name, 'version', '--registry', 'https://registry.npmjs.org'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
            } catch (err) {
              // Only "no such package" means "not published yet". Any other failure (network, auth, registry) must stop
              // the release: going on from a stale version could compute one npm already has, which publish skips.
              if (/E404|404 Not Found/.test(String(err.stderr || '') + String(err.stdout || ''))) { console.log(`${pkg.name}: not on npm yet`); continue; }
              console.error(`${pkg.name}: npm view failed:`, String(err.stderr || err.message).trim());
              process.exit(1);
            }
            if (published && newer(published, pkg.version)) {
              const indent = (/\n(\t| +)"/.exec(raw) || [, '\t'])[1];
              pkg.version = published;
              fs.writeFileSync(file, JSON.stringify(pkg, null, indent) + '\n');
              console.log(`${pkg.name}: ${JSON.parse(raw).version} -> ${published} (npm is ahead: an earlier bump PR has not reached main yet)`);
            } else {
              console.log(`${pkg.name}: ${pkg.version} (npm: ${published})`);
            }
          }
          EOF

      - name: Version bump via changesets
        if: steps.detect.outputs.release == 'true'
        run: |
          yarn version-packages

      # main only takes changes through pull requests (owner decision 2026-10-26: no token that pushes past that).
      # So the bump commit is not pushed to main. The packages are published from it below, and the bump goes to
      # develop as a pull request, reaching main through the normal develop -> stage -> main cascade. The release
      # tags that the publish step pushes point at this commit, which the PR branch keeps reachable.
      - name: Open the version bump PR into develop
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No version bump to commit"
            exit 0
          fi
          # No [skip ci]: the commit travels develop -> stage -> main and must not suppress those pushes' workflows.
          # The subject keeps the marker the change detection above skips.
          git commit -m "ci: sdk version bump via changeset"
          # The run attempt is part of the name, so a re-run after a failed publish pushes a branch of its own.
          branch="ci/sdk-version-bump-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${branch}"
          versions=$(git diff --name-only HEAD~1 HEAD -- 'packages/**/package.json' | while read -r f; do node -p "const p = require('./$f'); p.name + '@' + p.version"; done | tr '\n' ' ')
          gh pr create --base develop --head "$branch" \
            --title "ci: sdk version bump via changeset (main ${GITHUB_SHA::8})" \
            --body "Version bump made by **Release Ever Teams SDK to npm** (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on main \`${GITHUB_SHA::8}\`; the packages are published to npm from this commit. ${versions}

          Merge it into develop; it reaches main with the next develop -> stage -> main cascade. That run skips this commit when it looks for changed SDK packages, so it cuts no new release." \
            || echo "::warning title=Version bump PR::Could not open the PR; open one from ${branch} into develop by hand (the bump is pushed and the publish still runs)."

      - name: Publish changed packages using Changesets
        uses: changesets/action@v1
        with:
          publish: yarn publish-packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
