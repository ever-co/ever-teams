name: Build and Publish Docker Images Prod

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ever-teams-webapp:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Web version
        id: web-version
        shell: bash
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
            df -h /
            sudo swapoff -a
            sudo apt clean
            docker image ls -aq
            if [ "$(docker image ls -aq)" ]; then
              docker rmi $(docker image ls -aq)
            fi
            find ~/work/_temp -name "cache.tgz" -exec rm -f {} \;
            sudo rm -rf "/usr/local/share/boost"
            if [ -n "$AGENT_TOOLSDIRECTORY" ]; then sudo rm -rf "$AGENT_TOOLSDIRECTORY"; fi
            df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate NEXT_PUBLIC_GAUZY_API_SERVER_URL
        env:
          NEXT_PUBLIC_GAUZY_API_SERVER_URL: ${{ secrets.NEXT_PUBLIC_GAUZY_API_SERVER_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_GAUZY_API_SERVER_URL" ]; then
            echo "::error::NEXT_PUBLIC_GAUZY_API_SERVER_URL is not configured"
            exit 1
          fi
          echo "NEXT_PUBLIC_GAUZY_API_SERVER_URL is configured"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deploy/web/Dockerfile
          load: true
          # Note: CW registry tag removed — secret CW_DOCKER_REGISTRY is unset, which produced an invalid tag "/ever-co/...".
          # Re-add it together with the commented-out CW login/push steps below once CW_DOCKER_REGISTRY is configured.
          tags: |
            ghcr.io/ever-co/ever-teams-webapp:latest
            ghcr.io/ever-co/ever-teams-webapp:sha-${{ github.sha }}
            everco/ever-teams-webapp:latest
            everco/ever-teams-webapp:sha-${{ github.sha }}
            registry.digitalocean.com/ever/ever-teams-webapp:latest
            registry.digitalocean.com/ever/ever-teams-webapp:sha-${{ github.sha }}
          cache-from: type=registry,ref=everco/ever-teams-webapp:latest
          cache-to: type=inline
          # Deployment-specific values (API URL, captcha/analytics keys, board/meet endpoints, GitHub app, ...) are
          # NOT build args: Next.js would inline them into the published image, which self-hosters could then
          # never change. Each deployment sets them at runtime (k8s Secret / docker run -e); see .env.docker.
          # NEXT_PUBLIC_DEMO only sets the image's runtime default (final-stage ENV), it is not inlined.
          # The private-registry credential is a BuildKit secret, never a build arg: build args are readable
          # in `docker history`, are recorded in SLSA provenance, and land in any cache exported with
          # mode=max. Unset (forks) -> empty secret -> the Dockerfile falls back to the public registry.
          secrets: |
            verdaccio_token=${{ secrets.VERDACCIO_TOKEN }}
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_BUILD_VERSION=${{ steps.web-version.outputs.version }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_DEMO=false
            API_BASE_URL=${{ vars.API_BASE_URL }}
            CLIENT_BASE_URL=${{ vars.CLIENT_BASE_URL }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub Registry
        run: |
          docker push everco/ever-teams-webapp:latest
          docker push everco/ever-teams-webapp:sha-${{ github.sha }}

      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: doctl registry login --expiry-seconds 3600

      - name: Push to DigitalOcean Registry
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          docker push registry.digitalocean.com/ever/ever-teams-webapp:latest
          docker push registry.digitalocean.com/ever/ever-teams-webapp:sha-${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Push to Github Registry
        run: |
          docker push ghcr.io/ever-co/ever-teams-webapp:latest
          docker push ghcr.io/ever-co/ever-teams-webapp:sha-${{ github.sha }}

