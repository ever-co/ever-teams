name: 'Check Spelling and Typos with cspell'
on:
  push:
    branches: [develop]
  # Feature and fix PRs into develop deliberately run no CI (cost): develop is checked on push, and the
  # promotion PRs (develop -> stage, stage -> main) are checked before they merge.
  pull_request:
    branches: [stage, main, master]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Least privilege for the workflow token (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  spellcheck:
    name: Cspell
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: streetsidesoftware/cspell-action@v8
        with:
          # Github token used to fetch the list of changed files in the commit.
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          strict: true
          config: '.cspell.json'