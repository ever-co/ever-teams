name: Mobile Build, Deploy and Publish Apps iOS
on:
  # Allows re-running the published build by hand without touching app sources.
  workflow_dispatch:
  push:
    branches:
      - stage-apps
    paths:
      # This workflow's own definition — without it, editing this file never re-runs it,
      # so a fix to the workflow cannot be validated. The sibling entry below points at
      # an aggregate file that does not exist; left in place deliberately.
      - '.github/workflows/mobile.apps.stage.ios.yml'
      - '.github/workflows/mobile.apps.stage.yml'
      - 'apps/mobile/**'
      - 'package.json'
      - 'yarn.lock'
      # The EAS upload archive decides which workspaces get installed on the builder,
      # so a change to it changes the build as surely as a dependency bump does.
      - '.easignore'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    environment: stage

    permissions:
      contents: read

    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'yarn'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set Apple Store Credentials
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=${{ secrets.APPSTORE_ISSUER_ID }}" >> $GITHUB_ENV
          echo "APPSTORE_API_KEY_ID=${{ secrets.APPSTORE_API_KEY_ID }}" >> $GITHUB_ENV
          # Same defect the production iOS workflow had: the App Store Connect API key held in the
          # EAS credentials service has no Apple Team attached, so eas-cli gets teamId=undefined and
          # falls through to an interactive "Apple Team ID:" prompt that cannot be answered under
          # --non-interactive. eas-cli reads these two env vars directly. Without them the build
          # still proceeds, but Apple-side provisioning-profile validation is silently SKIPPED.
          #
          # Passed via the step's env: block below rather than interpolated into this script -
          # expanding a secret inline splices its value into the shell source (SonarCloud: "Avoid
          # expanding secrets in a run block").
          echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE" >> $GITHUB_ENV
          echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION" >> $GITHUB_ENV
        env:
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}

      - name: Replace Secrets in eas.json
        run: |
          sed -i 's|APPLE_ID_PLACEHOLDER|${{ secrets.APPLE_ID }}|' ./apps/mobile/eas.json
          sed -i 's|APPSTORE_ISSUER_ID_PLACEHOLDER|${{ secrets.APPSTORE_ISSUER_ID }}|' ./apps/mobile/eas.json
          sed -i 's|APPSTORE_API_KEY_ID_PLACEHOLDER|${{ secrets.APPSTORE_API_KEY_ID }}|' ./apps/mobile/eas.json
          sed -i 's|SENTRY_AUTH_TOKEN_PLACEHOLDER|${{ secrets.SENTRY_AUTH_TOKEN }}|g' ./apps/mobile/eas.json
          sed -i 's|SENTRY_ORG_PLACEHOLDER|${{ secrets.SENTRY_ORG }}|g' ./apps/mobile/eas.json
          sed -i 's|SENTRY_PROJECT_PLACEHOLDER|${{ secrets.EXPO_SENTRY_PROJECT }}|g' ./apps/mobile/eas.json

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@aa4ee19926fabcf820aa1294385a76aec6bdb548
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install Packages
        run: |
          yarn install --network-timeout 1000000 --frozen-lockfile
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Build Mobile
        run: |
          yarn build:mobile

      - name: Generate app.json and replace placeholders
        run: |
          cd apps/mobile && yarn config:mobile
        env:
          EXPO_PROJECT_SLUG: ${{ secrets.EXPO_PROJECT_SLUG }}
          EXPO_PROJECT_NAME: ${{ secrets.EXPO_PROJECT_NAME }}
          EXPO_PROJECT_OWNER: ${{ secrets.EXPO_PROJECT_OWNER }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PROJECT_PACKAGE_NAME: ${{ secrets.EXPO_PROJECT_PACKAGE_NAME || 'ever.teams' }}
          EXPO_PROJECT_IOS_BUNDLE_IDENTIFIER: ${{ secrets.EXPO_PROJECT_IOS_BUNDLE_IDENTIFIER || 'co.ever.teams' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          EXPO_SENTRY_PROJECT: ${{ secrets.EXPO_SENTRY_PROJECT }}

      # SECURITY: "Configure Registry" appends the internal registry + VERDACCIO_TOKEN to
      # .npmrc, which is a git-TRACKED file. eas-cli ships modified tracked files in the
      # build archive, so the token was being uploaded to Expo (their log shows
      # "PREPARE_PROJECT | .npmrc found at .npmrc"). Restore it before the upload. This also
      # stops Expo builders trying to reach packages.ever.co, which they cannot resolve.
      - name: Restore .npmrc before EAS upload
        shell: bash
        run: git checkout -- .npmrc || true

      - name: Build on EAS
        run: cd apps/mobile && eas build --profile internal --platform ios --non-interactive

      - name: Publish update
        # Publish to the CHANNEL these binaries actually listen on. The build step above uses
        # --profile internal, and eas.json bakes channel "internal" into that binary.
        # This previously used --auto, which derives the EAS branch from the GIT branch name, so
        # updates landed on a branch nobody listens to. On the production pipeline that meant
        # every OTA went to channel "apps" while shipped builds waited on channel "production",
        # which had zero updates in its whole history — OTA reached nobody. Verified against the
        # Expo API on 2026-08-15. --auto also supplied the message, so pass one explicitly.
        # The message goes through env: rather than being interpolated into the run line, so a
        # crafted ref name cannot splice shell into the command.
        run: cd apps/mobile && eas update --channel internal --message "$UPDATE_MESSAGE" --platform ios --non-interactive
        env:
          UPDATE_MESSAGE: ${{ github.ref_name }}@${{ github.sha }}

      # Written HERE, after "Build on EAS", and deliberately not earlier. `eas submit` is the
      # only consumer of this key and it runs on THIS runner, never on the Expo builder.
      # eas-cli uploads a shallow copy of the working directory (requireCommit defaults to
      # false), so anything on disk at `eas build` time is shipped to Expo. This key is
      # gitignored via `*.p8`, but .easignore REPLACES .gitignore rather than extending it
      # (eas-cli build/vcs/local.js:49-59), so that alone had already leaked it once.
      # .easignore now restates the rule AND the key is created too late to be captured —
      # two independent guarantees, so trimming either one cannot re-open the leak.
      #
      # Do NOT "fix" this with `requireCommit: true`: these jobs sed-edit eas.json and
      # generate an untracked apps/mobile/app.json, so eas-cli would abort with
      # "You have some uncommitted changes in your repository." (git.js:109-120), and a
      # commit-based archive would omit the generated app.json the build needs.
      - name: Create Apple API Key File
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > ./apps/mobile/AuthKey_R9QZ5LP8NK.p8

      - name: Upload App build to App store
        # GATED, not removed. This step could never have submitted the build above, and would
        # instead upload an unrelated PRODUCTION binary to App Store Connect.
        #
        # This job builds `--profile internal`, and eas.json marks that profile
        # "distribution": "internal". But `eas submit --latest` resolves its candidate through
        # getRecentBuildsForSubmissionAsync (eas-cli build/submit/utils/builds.js), which filters
        # `distribution: DistributionType.Store` and ignores the build profile entirely. An
        # internal-distribution build therefore can NEVER be selected here; --latest picks the
        # newest STORE build on the whole app - any profile, any branch, any author - across
        # statuses New, InQueue, InProgress and Finished.
        #
        # It has never fired only because this workflow has never produced a build: it dies
        # earlier at "EAS CLI couldn't find any credentials suitable for internal distribution".
        # Fixing that credential gap without this guard would have turned a staging run into an
        # unintended App Store Connect upload.
        #
        # Flip STAGE_IOS_SUBMIT_ENABLED to 'true' only once this step submits by explicit build
        # id, the way mobile.apps.ios.yml now does.
        if: ${{ vars.STAGE_IOS_SUBMIT_ENABLED == 'true' }}
        run: cd apps/mobile && eas submit --profile internal --platform ios --latest --non-interactive
