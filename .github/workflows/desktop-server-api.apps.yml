      # (bucket `ever` returns NoSuchBucket, which fails the whole publish after the GitHub upload).
      - name: Drop DigitalOcean Spaces publish target
        if: ${{ vars.DO_ENABLED != 'true' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/server-api/src/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const current = (pkg.build && pkg.build.publish) || [];
            const list = Array.isArray(current) ? current : [current];
            const kept = list.filter((p) => !(p && p.provider === "spaces"));
            if (kept.length !== list.length) {
              pkg.build.publish = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
              console.log("Removed spaces publish target; remaining publishers:", JSON.stringify(kept));
            } else {
              console.log("No spaces publish target present; nothing to do");
            }
          '

      - name: Build API Server App
        shell: cmd
        run: 'yarn build:gauzy-api-server:windows:release:gh:x64'
        env:
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          DO_KEY_ID: ${{ secrets.DO_KEY_ID }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          NX_NO_CLOUD: true
          NX_PLUGIN_NO_TIMEOUTS: true
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_API_SERVER_APP_NAME: "ever-teams-api-server"
          DESKTOP_API_SERVER_APP_DESCRIPTION: "Ever Teams API Server"
          DESKTOP_API_SERVER_APP_ID: "com.ever.everteamsapiserver"
          DESKTOP_API_SERVER_APP_REPO_NAME: "ever-teams-api-server"
          DESKTOP_API_SERVER_APP_REPO_OWNER: "ever-co"
          DESKTOP_API_SERVER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_API_SERVER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          # Translations: apps/server-api/i18n does not exist in this repo (only a README lives under
          # apps/server-api), so every per-language download from this URL 404s and gauzy's translation-util
          # then leaves apps/server-api/src/assets/i18n EMPTY (it only copies its bundled ui-core defaults
          # when the URL is unset) — the shipped app has no translations at all (seen on run 32038575765:
          # 13x "Error downloading language …: Not Found"). Leave the URL empty so the complete ui-core
          # translations are bundled; set repo/org var DESKTOP_I18N_FILES_URL to a folder of Ever
          # Teams-specific <lang>.json files to override (previous value:
