name: Server API Build Apps

on:
  workflow_run:
    workflows: ["Release Apps"]
    branches: [apps]
    types:
      - completed

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release-linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: ["${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: "ever-co/ever-gauzy"
          ref: master

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Change permissions
        run: "sudo chown -R $(whoami) ./*"

      - name: Install system dependencies
        # `rpm` provides rpmbuild, which fpm needs for the rpm target; GitHub-hosted images ship it,
        # the self-hosted ARC runner image (actions-runner + build toolchain) is not known to.
        run: 'sudo apt-get update && sudo apt install -y curl gnupg git libappindicator3-1 ca-certificates binutils icnsutils graphicsmagick rpm squashfs-tools'

      # The self-hosted ARC runners are containers without snapd, so `snap install snapcraft` fails
      # with "sudo: snap: command not found". Detect snapd and only install Snapcraft where it exists.
      - name: Detect snapd
        id: snapd
        shell: bash
        run: |
          if command -v snap >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "snapd is not available on this runner; skipping Snapcraft install"
          fi

      - name: Install Snapcraft
        if: ${{ steps.snapd.outputs.available == 'true' }}
        uses: samuelmeuli/action-snapcraft@v2

      - name: Fix node-gyp and Python
        run: python3 -m pip install --break-system-packages packaging setuptools || python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        shell: bash
        run: |
          if [ -n "${{ secrets.VERDACCIO_TOKEN }}" ]; then
            echo "//packages.ever.co/:_authToken=${{ secrets.VERDACCIO_TOKEN }}" >> .npmrc
            echo "registry=https://packages.ever.co/" >> .npmrc
          fi

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.serverapi(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_API_SERVER_APP_NAME: "ever-teams-api-server"
          DESKTOP_API_SERVER_REPO_NAME: "ever-teams-api-server"
          DESKTOP_API_SERVER_REPO_OWNER: "ever-co"
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_API_SERVER_APP_DESCRIPTION: "Ever Teams API Server"
          DESKTOP_API_SERVER_APP_ID: "com.ever.everteamsapiserver"

      # The upstream bump script (ever-gauzy) re-injects a DigitalOcean Spaces publish target
      # (bucket `ever`, sfo3). That bucket no longer exists (NoSuchBucket) and electron-builder
      # fails the whole publish when one provider errors. Keep GitHub Releases as the only publisher
      # unless DigitalOcean is explicitly re-enabled.
      - name: Drop DigitalOcean Spaces publish target
        if: ${{ vars.DO_ENABLED != 'true' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/server-api/src/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const current = (pkg.build && pkg.build.publish) || [];
            const list = Array.isArray(current) ? current : [current];
            const kept = list.filter((p) => !(p && p.provider === "spaces"));
            if (kept.length !== list.length) {
              pkg.build.publish = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
              console.log("Removed spaces publish target; remaining publishers:", JSON.stringify(kept));
            } else {
              console.log("No spaces publish target present; nothing to do");
            }
          '

      # `snap` needs snapcraft (build + Snap Store publish) and `flatpak` needs flatpak-builder;
      # neither exists on the ARC container runners. Build only the targets this runner can produce.
      # Set repo/org var DESKTOP_LINUX_KEEP_ALL_TARGETS=true to force the full upstream target list.
      - name: Adapt Linux targets to the runner toolchain
        if: ${{ vars.DESKTOP_LINUX_KEEP_ALL_TARGETS != 'true' }}
        shell: bash
        run: |
          HAS_SNAPCRAFT=false; command -v snapcraft >/dev/null 2>&1 && HAS_SNAPCRAFT=true
          HAS_FLATPAK=false; command -v flatpak-builder >/dev/null 2>&1 && HAS_FLATPAK=true
          echo "snapcraft available: $HAS_SNAPCRAFT, flatpak-builder available: $HAS_FLATPAK"
          HAS_SNAPCRAFT="$HAS_SNAPCRAFT" HAS_FLATPAK="$HAS_FLATPAK" node -e '
            const fs = require("fs");
            const file = "apps/server-api/src/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const linux = pkg.build && pkg.build.linux;
            if (!linux || !Array.isArray(linux.target)) {
              console.log("linux.target is not a list; leaving it untouched");
              process.exit(0);
            }
            const unavailable = [];
            if (process.env.HAS_SNAPCRAFT !== "true") unavailable.push("snap");
            if (process.env.HAS_FLATPAK !== "true") unavailable.push("flatpak");
            const name = (t) => (typeof t === "string" ? t : t && t.target);
            const kept = linux.target.filter((t) => !unavailable.includes(name(t)));
            if (kept.length !== linux.target.length) {
              linux.target = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
              console.log("Linux targets for this runner:", JSON.stringify(kept));
            } else {
              console.log("All configured Linux targets are buildable here:", JSON.stringify(kept));
            }
          '

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Build API Server App
        run: "yarn build:gauzy-api-server:linux:release:gh:x64"
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          DO_KEY_ID: ${{ secrets.DO_KEY_ID }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: false
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_API_SERVER_APP_NAME: "ever-teams-api-server"
          DESKTOP_API_SERVER_APP_DESCRIPTION: "Ever Teams API Server"
          DESKTOP_API_SERVER_APP_ID: "com.ever.everteamsapiserver"
          DESKTOP_API_SERVER_APP_REPO_NAME: "ever-teams-api-server"
          DESKTOP_API_SERVER_APP_REPO_OWNER: "ever-co"
          DESKTOP_API_SERVER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_API_SERVER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          # Translations: apps/server-api/i18n does not exist in this repo (only a README lives under
          # apps/server-api), so every per-language download from this URL 404s and gauzy's translation-util
          # then leaves apps/server-api/src/assets/i18n EMPTY (it only copies its bundled ui-core defaults
          # when the URL is unset) — the shipped app has no translations at all (seen on run 32038575765:
          # 13x "Error downloading language …: Not Found"). Leave the URL empty so the complete ui-core
          # translations are bundled; set repo/org var DESKTOP_I18N_FILES_URL to a folder of Ever
          # Teams-specific <lang>.json files to override (previous value:
          # https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/server-api/i18n).
          I18N_FILES_URL: ${{ vars.DESKTOP_I18N_FILES_URL }}
          PLATFORM_LOGO: "https://ever.team/assets/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "https://ever.team/assets/ever-teams-512x512.png"
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

  release-linux-arm64:
    # No arm64 Linux runner is available to this org right now: the Ubicloud pool behind
    # `ubicloud-standard-8-arm` never picks the job up, so it sits "queued" for hours and holds the
    # whole run in progress. Gated until an arm64 runner label exists — set repo/org var
    # RUNNER_LINUX_ARM64_8 to that label to turn this job back on (the ubicloud label stays as the
    # fallback value so nothing here needs rewriting).
    if: ${{ vars.RUNNER_LINUX_ARM64_8 != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: ["${{ vars.RUNNER_LINUX_ARM64_8 || 'ubicloud-standard-8-arm' }}"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
