name: Mobile Build, Deploy and Publish Apps iOS
on:
  # Allows re-running the published build by hand without touching app sources.
  workflow_dispatch:
  push:
    branches:
      - apps
    paths:
      # This workflow's own definition — without it, editing this file never re-runs it,
      # so a fix to the workflow cannot be validated. The sibling entry below points at
      # an aggregate file that does not exist; left in place deliberately.
      - '.github/workflows/mobile.apps.ios.yml'
      - '.github/workflows/mobile.apps.yml'
      - 'apps/mobile/**'
      - 'package.json'
      - 'yarn.lock'
      # The EAS upload archive decides which workspaces get installed on the builder,
      # so a change to it changes the build as surely as a dependency bump does.
      - '.easignore'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    environment: prod

    permissions:
      contents: read

    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'yarn'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set Apple Store Credentials
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=${{ secrets.APPSTORE_ISSUER_ID }}" >> $GITHUB_ENV
          echo "APPSTORE_API_KEY_ID=${{ secrets.APPSTORE_API_KEY_ID }}" >> $GITHUB_ENV
          # The App Store Connect API key stored in the EAS credentials service has no Apple Team
          # associated, so eas-cli receives teamId=undefined and falls through to an interactive
          # prompt ("Apple Team ID:") that cannot be answered under --non-interactive. eas-cli
          # reads these two env vars directly (credentials/ios/appstore/resolveCredentials.js).
          # Without them the build still proceeds, but Apple-side provisioning-profile validation
          # is silently SKIPPED — so set them and keep that check active.
          #
          # Referenced via the step's env: block rather than interpolated with an expression
          # directly in this script — expanding a secret inline splices its value into the shell
          # source, which is a script-injection risk (SonarCloud: "Avoid expanding secrets in a
          # run block").
          #
          # NB: do NOT write an empty expression (dollar-brace-brace with nothing inside) anywhere
          # in a run: block, not even in a "#" comment. Actions interpolates expressions across the
          # whole run string BEFORE the shell sees it, so the "#" does not protect it — an empty
          # expression is an "Invalid workflow file" error that fails the run with zero jobs.
          echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE" >> $GITHUB_ENV
          echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION" >> $GITHUB_ENV
        env:
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}

      - name: Replace Secrets in eas.json
        run: |
          sed -i 's|APPLE_ID_PLACEHOLDER|${{ secrets.APPLE_ID }}|' ./apps/mobile/eas.json
          sed -i 's|APPSTORE_ISSUER_ID_PLACEHOLDER|${{ secrets.APPSTORE_ISSUER_ID }}|' ./apps/mobile/eas.json
          sed -i 's|APPSTORE_API_KEY_ID_PLACEHOLDER|${{ secrets.APPSTORE_API_KEY_ID }}|' ./apps/mobile/eas.json
          sed -i 's|SENTRY_AUTH_TOKEN_PLACEHOLDER|${{ secrets.SENTRY_AUTH_TOKEN }}|g' ./apps/mobile/eas.json
          sed -i 's|SENTRY_ORG_PLACEHOLDER|${{ secrets.SENTRY_ORG }}|g' ./apps/mobile/eas.json
          sed -i 's|SENTRY_PROJECT_PLACEHOLDER|${{ secrets.EXPO_SENTRY_PROJECT }}|g' ./apps/mobile/eas.json

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@727973d766f3968d3f1184300af085872abcb20b
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install Packages
        run: |
          yarn install --network-timeout 1000000 --frozen-lockfile
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Build Mobile
        run: |
          yarn build:mobile

      - name: Generate app.json and replace placeholders
        run: |
          cd apps/mobile && yarn config:mobile
        env:
          EXPO_PROJECT_SLUG: ${{ secrets.EXPO_PROJECT_SLUG }}
          EXPO_PROJECT_NAME: ${{ secrets.EXPO_PROJECT_NAME }}
          EXPO_PROJECT_OWNER: ${{ secrets.EXPO_PROJECT_OWNER }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PROJECT_PACKAGE_NAME: ${{ secrets.EXPO_PROJECT_PACKAGE_NAME || 'ever.teams' }}
          EXPO_PROJECT_IOS_BUNDLE_IDENTIFIER: ${{ secrets.EXPO_PROJECT_IOS_BUNDLE_IDENTIFIER || 'co.ever.teams' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          EXPO_SENTRY_PROJECT: ${{ secrets.EXPO_SENTRY_PROJECT }}

      # SECURITY + CORRECTNESS: "Configure Registry" appends the internal registry +
      # VERDACCIO_TOKEN to .npmrc, which is a git-TRACKED file. eas-cli ships modified tracked
      # files in the build archive, so the token was being uploaded to Expo (their log shows
      # "PREPARE_PROJECT | .npmrc found at .npmrc"). Restore it before the upload. This also
      # stops Expo builders trying to reach packages.ever.co, which they cannot resolve.
      #
      # .npmrc is NOT the only file the step mutates. The shared configure-registry action also
      # appends `registry "<REGISTRY>"` to .yarnrc and sed-rewrites EVERY resolved URL in
      # yarn.lock to that registry, and on these runners the registry is the LAN-only Verdaccio
      # VIP. .easignore REPLACES .gitignore (it is not additive) and lists none of these three
      # files, so all three ship in the archive; the Expo builder then runs
      # `yarn install --frozen-lockfile` in the uploaded root and cannot resolve a single
      # tarball. Restoring only .npmrc leaves that lockfile poisoned.
      #
      # Same per-path loop as .github/workflows/release.sdk.prod.yml: tracked files are checked
      # out, untracked leftovers are removed. `if: always()` so a failed install still leaves
      # the checkout clean for the next job on this self-hosted runner.
      - name: Restore registry config before EAS upload
        shell: bash
        if: always()
        run: |
          for f in yarn.lock .npmrc .yarnrc; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git checkout -- "$f"
            else
              rm -f "$f"
            fi
          done
          rm -f yarn.lock.rewritten package-lock.json.rewritten

      - name: Build on EAS
        id: eas_build
        # Capture THIS build's id so the submit step can target it explicitly.
        #
        # `eas submit --latest` does NOT mean "the build this job just made". It resolves through
        # getRecentBuildsForSubmissionAsync (eas-cli build/submit/utils/builds.js), which filters
        # `distribution: DistributionType.Store` and ignores the build profile, the branch and who
        # started it, across statuses New, InQueue, InProgress AND Finished. So any
        # production-profile build started from a laptop or the Expo dashboard can win that race
        # and be the thing shipped to the store. That is not hypothetical: on 2026-08-16 the newest
        # STORE build on this app was one driven from a local checkout while debugging.
        #
        # The explicit FINISHED assertion also closes a second hole: `eas build --wait` exits 0 on
        # a CANCELED build, and `concurrency.cancel-in-progress: true` above makes cancellation
        # reachable, so without it a cancelled build would fall through to submit.
        #
        # The JSON is written to $RUNNER_TEMP, outside the repo, so it can never be picked up by
        # the EAS upload archive.
        run: |
          cd apps/mobile
          eas build --profile production --platform ios --non-interactive --json --wait > "$RUNNER_TEMP/eas-ios-build.json"
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/eas-ios-build.json", "utf8"));
            const build = Array.isArray(raw) ? raw[0] : raw;
            if (!build || build.status !== "FINISHED") {
              console.error("EAS build did not finish, refusing to submit. status=" + (build && build.status));
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "build_id=" + build.id + "\n");
            console.log("EAS build " + build.id + " FINISHED");
          '

      - name: Publish update
        # Publish to the CHANNEL these binaries actually listen on. The build step above uses
        # --profile production, and eas.json bakes channel "production" into that binary.
        # This previously used --auto, which derives the EAS branch from the GIT branch name, so
        # updates landed on a branch nobody listens to. On the production pipeline that meant
        # every OTA went to channel "apps" while shipped builds waited on channel "production",
        # which had zero updates in its whole history — OTA reached nobody. Verified against the
        # Expo API on 2026-08-15. --auto also supplied the message, so pass one explicitly.
        # The message goes through env: rather than being interpolated into the run line, so a
        # crafted ref name cannot splice shell into the command.
        run: cd apps/mobile && eas update --channel production --message "$UPDATE_MESSAGE" --platform ios --non-interactive
        env:
          UPDATE_MESSAGE: ${{ github.ref_name }}@${{ github.sha }}

      # Written HERE, after "Build on EAS", and deliberately not earlier. `eas submit` is the
      # only consumer of this key and it runs on THIS runner, never on the Expo builder.
      # eas-cli uploads a shallow copy of the working directory (requireCommit defaults to
      # false), so anything on disk at `eas build` time is shipped to Expo. This key is
      # gitignored via `*.p8`, but .easignore REPLACES .gitignore rather than extending it
      # (eas-cli build/vcs/local.js:49-59), so that alone had already leaked it once.
      # .easignore now restates the rule AND the key is created too late to be captured —
      # two independent guarantees, so trimming either one cannot re-open the leak.
      #
      # Do NOT "fix" this with `requireCommit: true`: these jobs sed-edit eas.json and
      # generate an untracked apps/mobile/app.json, so eas-cli would abort with
      # "You have some uncommitted changes in your repository." (git.js:109-120), and a
      # commit-based archive would omit the generated app.json the build needs.
      - name: Create Apple API Key File
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > ./apps/mobile/AuthKey_R9QZ5LP8NK.p8

      - name: Upload App build to App store
        run: cd apps/mobile && eas submit --profile production --platform ios --id "${{ steps.eas_build.outputs.build_id }}" --non-interactive
