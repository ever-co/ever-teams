name: Knip Review - Cleanup Unused Code - WEB

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  knip-review:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'

      - name: Install Packages
        run: yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts

      - name: Run Knip
        working-directory: apps/web
        run: yarn knip --cache --no-exit-code > reported-files.txt

      - name: Get list of changed files
        id: changed
        run: |
          {
            echo "CHANGED_FILES<<EOF"
            # Only evaluate source files for unused code. Exclude manifests/lockfiles:
            # knip lists unused dependencies with a trailing "package.json", which would
            # otherwise make this substring check fail for any dependency-bump PR.
            git diff --name-only origin/develop | grep '^apps/web/' | grep -vE '(package\.json|yarn\.lock)$' || true
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Check if changed files are in Knip report
        id: check_unused
        run: |
          FAIL=0
          FILES_WITH_UNUSED_CODE=""

          # Use a loop that runs in the same shell
          while read -r file; do
            REL_FILE="${file#apps/web/}"

            if [ -z "$file" ]; then
             continue
            fi

            if grep -qF "$REL_FILE" apps/web/reported-files.txt; then
              echo "❌ Found unused code in: $file"
              FILES_WITH_UNUSED_CODE+="$file"$'\n'
              FAIL=1
            fi
          done <<< "$CHANGED_FILES"

          echo "fail=$FAIL" >> $GITHUB_OUTPUT
          echo "reported_files<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$FILES_WITH_UNUSED_CODE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$FAIL" -eq 1 ]; then
            echo "🛑 Unused code detected in changed files:"
            echo "$FILES_WITH_UNUSED_CODE"
            exit 1
          else
            echo "✅ No unused code detected in changed files."
          fi

      - name: Comment on PR with unused code files
        if: failure() && steps.check_unused.outputs.fail == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORTED_FILES: ${{ steps.check_unused.outputs.reported_files }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find the pull request for this commit."
            exit 1
          fi
          node <<'NODE'
          const files = process.env.REPORTED_FILES.split('\n').filter(Boolean);
          const body = [
            '⚠️ **Unused code detected in the following changed files:**',
            '',
            ...files.map((file) => `- ${file}`),
            '',
            'Please review these files and clean up the unused code.'
          ].join('\n');
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.PR_NUMBER}/comments`,
            {
              method: 'POST',
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'content-type': 'application/json',
                'x-github-api-version': '2022-11-28'
              },
              body: JSON.stringify({ body })
            }
          );
          if (!response.ok) throw new Error(`GitHub comment failed with HTTP ${response.status}`);
          NODE
