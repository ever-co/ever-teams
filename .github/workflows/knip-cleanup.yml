name: Knip Review - Cleanup Unused Code - WEB

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  knip-review:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'

      - name: Install Packages
        run: yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts

      - name: Create head and base Knip reports
        run: |
          HEAD_REPORT="$RUNNER_TEMP/knip-head.json"
          BASE_REPORT="$RUNNER_TEMP/knip-base.json"
          CHANGED_FILES="$RUNNER_TEMP/knip-changed-files.txt"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          git diff --name-only "$BASE_SHA...HEAD" -- apps/web > "$CHANGED_FILES"
          (cd apps/web && yarn knip --no-exit-code --reporter json > "$HEAD_REPORT")

          # Use the already-installed dependency tree to inspect the exact PR base.
          # The checkout is disposable and restored before this step exits.
          trap 'git checkout HEAD -- apps/web' EXIT
          git checkout "$BASE_SHA" -- apps/web
          (cd apps/web && yarn knip --no-exit-code --reporter json > "$BASE_REPORT")
          git checkout HEAD -- apps/web
          trap - EXIT

          echo "HEAD_REPORT=$HEAD_REPORT" >> "$GITHUB_ENV"
          echo "BASE_REPORT=$BASE_REPORT" >> "$GITHUB_ENV"
          echo "CHANGED_FILES=$CHANGED_FILES" >> "$GITHUB_ENV"

      - name: Check for new Knip findings
        id: check_unused
        run: |
          RESULT_FILE="$RUNNER_TEMP/knip-new-findings.txt"
          set +e
          node tools/knip/compare-knip-reports.mjs \
            --base="$BASE_REPORT" \
            --head="$HEAD_REPORT" \
            --changed="$CHANGED_FILES" > "$RESULT_FILE" 2>&1
          STATUS=$?
          set -e

          cat "$RESULT_FILE"
          echo "fail=$STATUS" >> "$GITHUB_OUTPUT"
          echo "reported_findings<<EOF" >> "$GITHUB_OUTPUT"
          cat "$RESULT_FILE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Comment on PR with new Knip findings
        if: failure() && steps.check_unused.outputs.fail == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORTED_FINDINGS: ${{ steps.check_unused.outputs.reported_findings }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find the pull request for this commit."
            exit 1
          fi
          node <<'NODE'
          const findings = process.env.REPORTED_FINDINGS.split('\n').filter(Boolean);
          const body = [
            '⚠️ **New Knip findings introduced by this pull request:**',
            '',
            '```text',
            ...findings,
            '```',
            '',
            'Existing findings from the base branch are excluded.'
          ].join('\n');
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.PR_NUMBER}/comments`,
            {
              method: 'POST',
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'content-type': 'application/json',
                'x-github-api-version': '2022-11-28'
              },
              body: JSON.stringify({ body })
            }
          );
          if (!response.ok) throw new Error(`GitHub comment failed with HTTP ${response.status}`);
          NODE
