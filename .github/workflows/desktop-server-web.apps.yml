name: Server Web Build Apps

on:
  workflow_run:
    workflows: ["Release Apps"]
    branches: [apps]
    types:
      - completed

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release-linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        # Self-hosted ARC runner (fleet policy: no GitHub-hosted / Ubicloud runners). snapd cannot run in
        # the ARC container, so the Snapcraft step below is skipped there and the `snap` target is dropped
        # for this run ("Adapt Linux targets"); deb / tar.gz / rpm / AppImage are still built + published.
        os: ["${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Change permissions
        run: "sudo chown -R $(whoami) ./*"

      - name: Install system dependencies
        run: 'sudo apt-get update && sudo apt install -y curl gnupg git libappindicator3-1 ca-certificates binutils icnsutils graphicsmagick rpm'

      - name: Detect snapd
        id: snapd
        shell: bash
        run: |
          if command -v snap >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "snapd is not available on this runner (ARC container); skipping Snapcraft install"
          fi

      - name: Install Snapcraft
        if: ${{ steps.snapd.outputs.available == 'true' }}
        uses: samuelmeuli/action-snapcraft@v2

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        shell: bash
        run: |
          if [ -n "${{ secrets.VERDACCIO_TOKEN }}" ]; then
            echo "//packages.ever.co/:_authToken=${{ secrets.VERDACCIO_TOKEN }}" >> .npmrc
            echo "registry=https://packages.ever.co/" >> .npmrc
          fi

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.serverweb(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_WEB_SERVER_APP_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_REPO_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_REPO_OWNER: "ever-co"
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_WEB_SERVER_APP_DESCRIPTION: "Ever Teams Web Server"
          DESKTOP_WEB_SERVER_APP_ID: "com.ever.everteamswebserver"

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Adapt Linux targets to the runner toolchain
        if: ${{ vars.DESKTOP_LINUX_KEEP_ALL_TARGETS != 'true' }}
        shell: bash
        run: |
          # apps/server-web/package.json lists deb, snap, tar.gz, rpm, AppImage. `snap` needs snapcraft
          # (absent inside the ARC container) — drop only what this runner cannot build; a VM runner with
          # snapcraft keeps the full list. Set DESKTOP_LINUX_KEEP_ALL_TARGETS=true to disable this step.
          HAS_SNAPCRAFT=false; command -v snapcraft >/dev/null 2>&1 && HAS_SNAPCRAFT=true
          echo "snapcraft available: $HAS_SNAPCRAFT"
          HAS_SNAPCRAFT="$HAS_SNAPCRAFT" node -e '
            const fs = require("fs");
            const file = "apps/server-web/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const linux = pkg.build && pkg.build.linux;
            if (!linux || !Array.isArray(linux.target)) { console.log("linux.target is not a list; untouched"); process.exit(0); }
            const name = (t) => (typeof t === "string" ? t : t && t.target);
            const kept = process.env.HAS_SNAPCRAFT === "true" ? linux.target : linux.target.filter((t) => name(t) !== "snap");
            if (kept.length !== linux.target.length) {
              linux.target = kept;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 4) + String.fromCharCode(10));
              console.log("Linux targets for this runner:", JSON.stringify(kept.map(name)));
            } else {
              console.log("All configured Linux targets are buildable here:", JSON.stringify(kept.map(name)));
            }
          '

      - name: Build Web Server App
        run: "yarn build:web-server:linux:release:gh:x64"
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: false
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_WEB_SERVER_APP_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_APP_DESCRIPTION: "Ever Teams Web Server"
          DESKTOP_WEB_SERVER_APP_ID: "com.ever.everteamswebserver"
          DESKTOP_WEB_SERVER_APP_REPO_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_APP_REPO_OWNER: "ever-co"
          DESKTOP_WEB_SERVER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_WEB_SERVER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          I18N_FILES_URL: "https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/server-web/i18n"
          PLATFORM_LOGO: "https://ever.team/assets/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "https://ever.team/assets/ever-teams-512x512.png"
          DESKTOP_WEB_SERVER_APP_DEFAULT_PORT: 3001
          GAUZY_API_SERVER_URL: "https://api.ever.team"
          NEXT_PUBLIC_GAUZY_API_SERVER_URL: "https://api.ever.team"
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

  release-linux-arm64:
    # No runner carries the `ubicloud-standard-8-arm` label any more (the Ubicloud
    # integration is gone from the org and there is no self-hosted arm64 runner): every run
    # of this job sat "queued" until the next run's cancel-in-progress killed it (~6h each).
    # Gate it on the RUNNER_LINUX_ARM64_8 org/repo variable — set it to an arm64 runner
    # label (a self-hosted VM, or `ubicloud-standard-8-arm` if Ubicloud is re-enabled) to
    # bring this leg back; until then it is skipped instead of hanging.
    if: ${{ vars.RUNNER_LINUX_ARM64_8 != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: ["${{ vars.RUNNER_LINUX_ARM64_8 || 'ubicloud-standard-8-arm' }}"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Change permissions
        run: "sudo chown -R $(whoami) ./*"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl gnupg git libappindicator3-1 ca-certificates binutils icnsutils graphicsmagick libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v2

      - name: Install Multipass
        run: 'sudo snap install multipass'

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        shell: bash
        run: |
          if [ -n "${{ secrets.VERDACCIO_TOKEN }}" ]; then
            echo "//packages.ever.co/:_authToken=${{ secrets.VERDACCIO_TOKEN }}" >> .npmrc
            echo "registry=https://packages.ever.co/" >> .npmrc
          fi

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.serverweb(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_WEB_SERVER_APP_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_REPO_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_REPO_OWNER: "ever-co"
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_WEB_SERVER_APP_DESCRIPTION: "Ever Teams Web Server"
          DESKTOP_WEB_SERVER_APP_ID: "com.ever.everteamswebserver"

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Build Web Server App
        run: "yarn build:web-server:linux:release:gh:arm64"
        env:
          USE_HARD_LINKS: false
          USE_SYSTEM_FPM: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: false
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_WEB_SERVER_APP_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_APP_DESCRIPTION: "Ever Teams Web Server"
          DESKTOP_WEB_SERVER_APP_ID: "com.ever.everteamswebserver"
          DESKTOP_WEB_SERVER_APP_REPO_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_APP_REPO_OWNER: "ever-co"
          DESKTOP_WEB_SERVER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_WEB_SERVER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          I18N_FILES_URL: "https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/server-web/i18n"
          PLATFORM_LOGO: "https://ever.team/assets/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "https://ever.team/assets/ever-teams-512x512.png"
          DESKTOP_WEB_SERVER_APP_DEFAULT_PORT: 3001
          GAUZY_API_SERVER_URL: "https://api.ever.team"
          NEXT_PUBLIC_GAUZY_API_SERVER_URL: "https://api.ever.team"
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
          SNAPCRAFT_BUILD_ENVIRONMENT: host

  release-mac:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: [ghcr.io/cirruslabs/macos-runner:tahoe]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Fix node-gyp and Python
        run: python3 -m pip install --break-system-packages packaging setuptools || python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        shell: bash
        run: |
          if [ -n "${{ secrets.VERDACCIO_TOKEN }}" ]; then
            echo "//packages.ever.co/:_authToken=${{ secrets.VERDACCIO_TOKEN }}" >> .npmrc
            echo "registry=https://packages.ever.co/" >> .npmrc
          fi

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.serverweb(true))
        env:
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_WEB_SERVER_APP_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_REPO_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_REPO_OWNER: "ever-co"
          COMPANY_SITE_LINK: "https://ever.team"
          DESKTOP_WEB_SERVER_APP_DESCRIPTION: "Ever Teams Web Server"
          DESKTOP_WEB_SERVER_APP_ID: "com.ever.everteamswebserver"

      - name: Prepare Apple API Key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Configure Code Signing
        run: |
          # Deliberately does NOT export CSC_LINK. Setting it makes electron-builder build its own
          # keychain, which is the code path that is broken (see the import step below). The cert is
          # imported there instead and handed over via CSC_KEYCHAIN.
          if [ -n "$CSC_LINK_VALUE" ]; then
            echo "CSC_KEYCHAIN=$RUNNER_TEMP/ever-signing.keychain-db" >> $GITHUB_ENV
          fi
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK_BASE64 }}

      # macOS signing: build the keychain ourselves instead of letting electron-builder do it.
      # app-builder-lib passes the p12 password to `security set-key-partition-list -k`, which
      # expects the KEYCHAIN password — fatal on the current runner image, and still unfixed in
      # the latest release. With CSC_LINK unset, electron-builder skips its own keychain code and
      # uses CSC_KEYCHAIN (macPackager.js:25-48), so this sidesteps the bug without patching deps.
      - name: Import Apple signing certificate into a keychain
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ever-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/ever-signing-cert.p12"
          printf '%s' "$CSC_LINK_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          # The KEYCHAIN password here — this is the exact call app-builder-lib gets wrong.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          rm -f "$CERT"
          # Fail loudly here rather than silently shipping an unsigned app later.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee /tmp/identities.txt
          grep -q "Developer ID Application" /tmp/identities.txt

      - name: Build Web Server App
        run: "yarn build:web-server:mac:release"
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: "${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}"
          SENTRY_PROFILE_SAMPLE_RATE: "${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}"
          SENTRY_HTTP_TRACING_ENABLED: "${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}"
          SENTRY_POSTGRES_TRACKING_ENABLED: "${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}"
          SENTRY_PROFILING_ENABLED: "${{ secrets.SENTRY_PROFILING_ENABLED }}"
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: false
          NX_DAEMON: false
          COMPANY_SITE: "Ever Teams"
          COMPANY_SITE_LINK: "https://ever.team"
          COMPANY_FACEBOOK_LINK: "https://www.facebook.com/everteamshq"
          COMPANY_TWITTER_LINK: "https://twitter.com/ever_teams"
          COMPANY_LINKEDIN_LINK: "https://www.linkedin.com/company/ever-co"
          PROJECT_REPO: "https://github.com/ever-co/ever-teams.git"
          DESKTOP_WEB_SERVER_APP_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_APP_DESCRIPTION: "Ever Teams Web Server"
          DESKTOP_WEB_SERVER_APP_ID: "com.ever.everteamswebserver"
          DESKTOP_WEB_SERVER_APP_REPO_NAME: "ever-teams-web-server"
          DESKTOP_WEB_SERVER_APP_REPO_OWNER: "ever-co"
          DESKTOP_WEB_SERVER_APP_WELCOME_TITLE: "Welcome to Ever Teams"
          DESKTOP_WEB_SERVER_APP_WELCOME_CONTENT: "Ever Teams is a productivity tool that helps you to stay focused on your work and manage your team work better."
          I18N_FILES_URL: "https://raw.githubusercontent.com/ever-co/ever-teams/develop/apps/server-web/i18n"
          PLATFORM_LOGO: "https://ever.team/assets/ever-teams.png"
          GAUZY_DESKTOP_LOGO_512X512: "https://ever.team/assets/ever-teams-512x512.png"
          DESKTOP_WEB_SERVER_APP_DEFAULT_PORT: 3001
          GAUZY_API_SERVER_URL: "https://api.ever.team"
          NEXT_PUBLIC_GAUZY_API_SERVER_URL: "https://api.ever.team"
          # macOS notarization. electron-builder 26 accepts ONE credential set and checks the
          # Apple-ID pair FIRST: whenever APPLE_ID is set it demands APPLE_APP_SPECIFIC_PASSWORD
          # and aborts the build ("APPLE_APP_SPECIFIC_PASSWORD env var needs to be set") before
          # it ever looks at the App Store Connect API key. The intended path here is the API
          # key (APPLE_API_KEY* below; the afterSign hook apps/server-web/.erb/scripts/notarize.js
          # defers to electron-builder for it), and no APPLE_ID_APP_PASSWORD secret exists, so
          # the Apple-ID pair is only exported when an app-specific password is actually set.
          # (electron-builder reads APPLE_APP_SPECIFIC_PASSWORD; APPLE_ID_APP_PASSWORD is kept
          # for the older name.)
          APPLE_ID: ${{ secrets.APPLE_ID_APP_PASSWORD != '' && secrets.APPLE_ID || '' }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Must be true: the Developer ID identity now lives in the keychain we imported above,
          # and electron-builder finds it by discovery. With this false it would skip signing.
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_API_KEY: /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  release-windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    environment: prod

    strategy:
      matrix:
        os: [[self-hosted, Windows, X64]]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Selective cleanup (preserve .nx/cache)
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # Stop NX daemon first to release file locks before cleanup (guard for fresh runners without Node)
