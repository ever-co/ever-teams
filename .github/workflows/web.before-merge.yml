name: Web Build Before Merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.deploy/web/**'
      - '.github/workflows/web.before-merge.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'tools/performance/**'
      - 'tools/preservation/**'
      - 'docker-compose.build.yml'
      - 'docker-compose.dev.yml'
      - 'nx.json'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'yarn.lock'
      - 'README.md'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip workflow if PR is from develop to main
        if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main'
        run: |
          echo "PR is from develop to main. Skipping the workflow."
          echo "::set-output name=skipped::true"
        id: skip_check

      - name: Check if skipped
        if: steps.skip_check.outputs.skipped == 'true'
        run: echo "Workflow was skipped" && exit 0

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo swapoff -a
          sudo apt clean
          docker image ls -aq
          if [ "$(docker image ls -aq)" ]; then
            docker rmi $(docker image ls -aq)
          fi
          find ~/work/_temp -name "cache.tgz" -exec rm -f {} \;
          sudo rm -rf "/usr/local/share/boost"
          if [ -n "$AGENT_TOOLSDIRECTORY" ]; then sudo rm -rf "$AGENT_TOOLSDIRECTORY"; fi
          df -h /

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'yarn'

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@727973d766f3968d3f1184300af085872abcb20b
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install Packages
        run: |
          yarn install --network-timeout 1000000 --frozen-lockfile
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Test Web
        run: yarn test:web --runInBand

      - name: Test performance tooling
        run: yarn test:performance

      - name: Verify preserved feature surface
        run: yarn preservation:web

      - name: Typecheck Web
        run: yarn workspace @ever-teams/web tsc --noEmit -p tsconfig.json

      - name: Lint Web
        run: yarn nx run web:lint

      - name: Audit affected projects
        run: yarn nx show projects --affected --base=${{ github.event.pull_request.base.sha }} --head=HEAD

      - name: Verify affected projects
        run: yarn nx affected -t lint,test,build --base=${{ github.event.pull_request.base.sha }} --head=HEAD

      - name: Build Web

        run: |
          export SHARP_IGNORE_GLOBAL_LIBVIPS=1
          export SHARP_FORCE_GLOBAL_LIBVIPS=false
          yarn build:web

  browser-parity:
    needs: deploy
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        fast_app_bootstrap: ['false', 'true']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'yarn'

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@727973d766f3968d3f1184300af085872abcb20b
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install Packages
        run: yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Install trusted Cypress binary
        run: yarn cypress install

      - name: Build deterministic browser app
        run: yarn build:web
        env:
          AUTH_SECRET: deterministic-cypress-only-not-a-secret
          GAUZY_API_SERVER_URL: http://127.0.0.1:3988
          NEXT_PUBLIC_FAST_APP_BOOTSTRAP: ${{ matrix.fast_app_bootstrap }}
          NEXT_PUBLIC_GAUZY_API_SERVER_URL: http://127.0.0.1:3988
          NEXT_PUBLIC_PRELOAD_YEAR_TIME_LOGS: 'false'
          SHARP_FORCE_GLOBAL_LIBVIPS: 'false'
          SHARP_IGNORE_GLOBAL_LIBVIPS: '1'

      - name: Run deterministic browser parity
        shell: bash
        env:
          AUTH_SECRET: deterministic-cypress-only-not-a-secret
          CYPRESS_BASE_URL: http://127.0.0.1:3030
          GAUZY_API_SERVER_URL: http://127.0.0.1:3988
          NEXT_PUBLIC_FAST_APP_BOOTSTRAP: ${{ matrix.fast_app_bootstrap }}
          NEXT_PUBLIC_GAUZY_API_SERVER_URL: http://127.0.0.1:3988
          NEXT_PUBLIC_PRELOAD_YEAR_TIME_LOGS: 'false'
        run: |
          yarn start:web > "$RUNNER_TEMP/ever-teams-web-${{ matrix.fast_app_bootstrap }}.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl -sS -o /dev/null http://127.0.0.1:3030/; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/ever-teams-web-${{ matrix.fast_app_bootstrap }}.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 100 "$RUNNER_TEMP/ever-teams-web-${{ matrix.fast_app_bootstrap }}.log"
            exit 1
          fi
          yarn e2e:web
          if [ "${{ matrix.fast_app_bootstrap }}" = "true" ]; then
            node tools/performance/compare-fast-startup.mjs --candidate=artifacts/fast-startup-candidate.json --out=artifacts/fast-startup-report.json
          fi

      - name: Record live performance status
        run: echo "Live performance NOT RUN in CI; this job uses the deterministic browser fixture and does not claim database-backed timing evidence."

      - name: Upload sanitized deterministic performance evidence
        if: always() && matrix.fast_app_bootstrap == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: fast-startup-performance-${{ github.sha }}
          path: |
            artifacts/fast-startup-candidate.json
            artifacts/fast-startup-report.json
          if-no-files-found: warn
