# SonarCloud automatic analysis settings (read from the default branch, develop).
#
# The mobile locales (ar.ts, bg.ts, en.ts, ...) are TypeScript objects with the same keys in every language. Copy-paste
# detection treats every string literal as the same token, so each new block of strings counts as duplicated 8 times
# over (#5383: 494 of its 517 duplicated lines). They stay analysed for issues; only copy-paste detection skips them.
# `??.ts` names the two-letter locale files only, so i18n.ts, index.ts and translate.ts keep the duplication check.
#
# The Playwright manifests (apps/web/playwright/suites/api/*.generated.ts) are lists written by a script, one
# { path, verb } object per route handler: every entry has the same shape, so they read as one long duplicate.
sonar.cpd.exclusions=apps/mobile/app/i18n/??.ts,apps/web/playwright/suites/api/*.generated.ts
