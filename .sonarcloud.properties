# SonarCloud automatic analysis settings (read from the default branch, develop).
#
# The mobile locales are TypeScript objects with the same keys in every language. Copy-paste detection treats every
# string literal as the same token, so each new block of strings counts as duplicated 8 times over (#5383: 494 of its
# 517 duplicated lines). They stay analysed for issues; only copy-paste detection skips them.
sonar.cpd.exclusions=apps/mobile/app/i18n/**
