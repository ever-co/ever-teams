# SonarCloud automatic analysis settings (read from the default branch, develop).
#
# The mobile locales (ar.ts, bg.ts, en.ts, ...) are TypeScript objects with the same keys in every language. Copy-paste
# detection treats every string literal as the same token, so each new block of strings counts as duplicated 8 times
# over (#5383: 494 of its 517 duplicated lines). They stay analysed for issues; only copy-paste detection skips them.
# `??.ts` names the two-letter locale files only, so i18n.ts, index.ts and translate.ts keep the duplication check.
#
# The Playwright manifests (apps/web/playwright/suites/api/*.generated.ts) are lists written by a script, one
# { path, verb } object per route handler: every entry has the same shape, so they read as one long duplicate.
sonar.cpd.exclusions=apps/mobile/app/i18n/??.ts,apps/web/playwright/suites/api/*.generated.ts

#
# The Playwright suites are test code, and Sonar was scoring them as production code (PR #5675).
#
# `apps/web/playwright/**` is a test harness plus `*.spec.ts` suites that drive this app's own routes and pages against a
# local test backend; none of it ships. Left in the main-code pool it fails the quality gate for reasons that are not
# findings: 5.8% new-code duplication (required ≤ 3%) — a spec repeats its probe-and-witness shape per case on purpose,
# and the shared readers now live in `apps/web/playwright/suites/api/log-helpers.ts` — and a B security rating (required
# ≥ A) driven by "hard-coded credential" hotspots on fixtures that are only ever posted to the loopback mock
# (`127.0.0.1:<lane port>`), never to a service.
#
# Test inclusions keep every one of those files analysed for issues; what stops is counting them as new production code.
# The globs are deliberately wider than `*.spec.ts`, on purpose: a fixture, a shared reader (`suites/api/log-helpers.ts`)
# or a generated list (`suites/api/*.generated.ts`) is test code exactly as much as the spec that imports it, and labelling
# only the specs would leave the helpers in the production pool — which is where the duplicated lines were counted.
# Read from the default branch, so this changes the analysis of the PRs merged after it, not this PR's own gate.
sonar.test.inclusions=apps/web/playwright/suites/**/*.spec.ts,apps/web/playwright/suites/**/*.ts,apps/web/playwright/*.ts
